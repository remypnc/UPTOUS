document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px 30px 0\">L'hôte lancera les cartes au fil de la journée. Tu recevras chaque choix ici, au bon moment.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <!-- BOTTOM NAV -->\n    <div style=\"position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(250,246,241,.95);backdrop-filter:blur(10px);border-top:1px solid #ece0d6;display:flex;padding:8px 6px 10px;z-index:40\">\n      <sc-if value=\"{{ isHost }}\" hint-placeholder-val=\"{{ true }}\">\n        <button sc-camel-on-click=\"{{ navParcours }}\" style=\"flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:{{ colParcours }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"6\" cy=\"18.5\" r=\"2.2\"><\u002Fcircle><circle cx=\"18\" cy=\"5.5\" r=\"2.2\"><\u002Fcircle><path d=\"M8.2 17.6h6a3.1 3.1 0 0 0 0-6.2h-4.4a3.1 3.1 0 0 1 0-6.2H16\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10.5px;font-weight:700\">Parcours<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ navJouer }}\" style=\"flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:{{ colJouer }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"8\" y=\"4\" width=\"12\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M4 7v11a2 2 0 0 0 2 2h9\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10.5px;font-weight:700\">Jouer<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ navHistory }}\" style=\"flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:{{ colHistory }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M12 7.5v5l3 2\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10.5px;font-weight:700\">Historique<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ navResults }}\" style=\"flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:{{ colResults }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 20V10M12 20V4M19 20v-7\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10.5px;font-weight:700\">Résultats<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isGuest }}\" hint-placeholder-val=\"\">\n        <button sc-camel-on-click=\"{{ navLive }}\" style=\"flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:{{ colLive }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"><\u002Fcircle><path d=\"M10 9l5 3-5 3z\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10.5px;font-weight:700\">À jouer<\u002Fspan><\u002Fbutton>\n        <button sc-camel-on-click=\"{{ navResults }}\" style=\"flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:{{ colResults }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 20V10M12 20V4M19 20v-7\"><\u002Fpath><\u002Fsvg><span style=\"font-size:10.5px;font-weight:700\">Résultats<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ confetti }}\" hint-placeholder-val=\"\">\n    <div style=\"position:fixed;inset:0;pointer-events:none;z-index:60\">\n      <sc-for list=\"{{ confettiPieces }}\" as=\"c\" hint-placeholder-count=\"0\"><div style=\"position:absolute;top:0;left:{{ c.left }};width:{{ c.size }};height:{{ c.size }};background:{{ c.color }};border-radius:2px;animation:conf {{ c.dur }} linear {{ c.delay }} forwards\"><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"\">\n    <div style=\"position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#3f3733;color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:13px;z-index:70;animation:pop .3s ease both\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:900}}\">\nconst RANKS = ['S','A','B','C','D','E','F'];\nconst RANKC = {S:'#c26a4a',A:'#d98f5c',B:'#d9b45f',C:'#6f9a7d',D:'#6f93a0',E:'#8f83b0',F:'#a99a90'};\nconst CATS = [\n  {id:'sale', name:'Salé'},{id:'dessert', name:'Dessert'},{id:'lieu', name:'Lieux'},\n  {id:'activite', name:'Activités'},{id:'ambiance', name:'Ambiance'},{id:'deplacement', name:'Déplacement'},\n];\nconst uid = () => Math.random().toString(36).slice(2,9);\nconst slug = s => s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid();\nfunction seedItems(cat, arr){ return arr.map(([n,e])=>({id:slug(n), name:n, emoji:e, cat, enabled:true, mandatory:false})); }\nfunction fullCatalog(){\n  return {\n    sale: seedItems('sale',[['Crêpe salée','🥞'],['Sando pain de mie','🥪'],['Bao','🥟'],['Ramen','🍜'],['Burger','🍔'],['Pizza','🍕'],['Sushi','🍣'],['Curry','🍛'],['Nouilles sautées','🍝'],['Poké','🥗'],['Tacos','🌮'],['Kebab','🥙'],['Gyozas','🥟'],['Onigiri','🍙'],['Bibimbap','🍲'],['Brunch salé','🍳']]),\n    dessert: seedItems('dessert',[['Glace','🍦'],['Crêpe sucrée','🥞'],['Gaufre','🧇'],['Cookie','🍪'],['Cheesecake','🍰'],['Mochi','🍡'],['Tiramisu','🍮'],['Bubble tea','🧋'],['Churros','🥨'],['Donut','🍩'],['Brownie','🍫'],['Pâtisserie','🧁'],['Café gourmand','☕'],['Fruit frais','🍓'],['Yaourt glacé','🍨']]),\n    lieu: seedItems('lieu',[['Rougier & Plé','🎨'],['Carré Pain de Mie','🥪'],['Jardin Anne Frank','🌳'],['Hanoi Café 1988','🌸'],['La Créma','🍦'],['Jardin du Luxembourg','🌳'],['Place de la Contrescarpe','🏛️'],['Oroyana','🥞']]),\n    activite: seedItems('activite',[['Pâte à modeler','🎨'],['Balade','🚶'],['Photo souvenir','📸'],['Deviner l\\u2019objet','🔮'],['Objet duo','🧩']]),\n    ambiance: seedItems('ambiance',[['Petit jardin','🌱'],['Grand jardin','🌳'],['Petite place vivante','🏛️'],['Café romantique','🌸']]),\n    deplacement: seedItems('deplacement',[['Marcher ~30 min','🚶'],['Prendre les transports','🚇']]),\n  };\n}\nfunction emptyCatalog(){ const c={}; CATS.forEach(x=>c[x.id]=[]); return c; }\nfunction findItem(cat, id){ for(const k in cat){ const f=(cat[k]||[]).find(x=>x.id===id); if(f) return f; } return null; }\nfunction defQuestions(){\n  return [\n    {id:'q_place', text:'Pour manger, tu préfères sur place ou à emporter ?', a:{id:'surplace',name:'Sur place',emoji:'🍽️'}, b:{id:'emporter',name:'À emporter',emoji:'🥡'}},\n    {id:'q_move', text:'Pour la suite, tu préfères marcher ou aller plus vite ?', a:{id:'marche',name:'Marcher ~30 min',emoji:'🚶'}, b:{id:'transport',name:'Les transports',emoji:'🚇'}},\n    {id:'q_end', text:'Fin de journée : petite place animée ou grand jardin calme ?', a:{id:'place',name:'Petite place',emoji:'🏛️'}, b:{id:'jardin',name:'Grand jardin',emoji:'🌳'}},\n    {id:'q_after', text:'Après manger, plutôt créer ou te balader ?', a:{id:'creer',name:'Créer',emoji:'🎨'}, b:{id:'balade',name:'Une balade',emoji:'🚶'}},\n  ];\n}\nfunction emptyTier(){ const t={pool:[]}; RANKS.forEach(r=>t[r]=[]); return t; }\nfunction blankOuting(title){\n  return {id:'o_'+uid(), title:title||'Nouvelle sortie', date:new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}),\n    catalog:emptyCatalog(), forced:[], questions:defQuestions(), timeline:[], answers:{}, favorites:{host:{},guest:{}}, tested:[], tier:{host:emptyTier(),guest:emptyTier()}, status:'draft'};\n}\nfunction templateOuting(title){\n  const cat=fullCatalog();\n  const o=blankOuting(title);\n  o.catalog=cat;\n  o.forced=[{id:'f_plat',cat:'sale',a:'crepe-salee',b:'sando-pain-de-mie',mandatory:true},{id:'f_dessert',cat:'dessert',a:'glace',b:'crepe-sucree',mandatory:true}];\n  o.timeline=[\n    {id:'s1',title:'Rougier & Plé',detail:'Acheter de quoi fabriquer ensemble.',kind:'place',done:false},\n    {id:'s2',title:'Choix du déjeuner',detail:'Duel imposé : le gagnant reste.',kind:'forced',ref:'f_plat',done:false},\n    {id:'s3',title:'Sur place ou à emporter',detail:'Une question rapide.',kind:'question',ref:'q_place',done:false},\n    {id:'s4',title:'Jardin Anne Frank',detail:'Si repas à emporter — coin tranquille.',kind:'place',done:false},\n    {id:'s5',title:'Hanoi Café 1988',detail:'Pause créative · pâte à modeler.',kind:'place',done:false},\n    {id:'s6',title:'Déplacement dessert',detail:'Marche ou transports.',kind:'question',ref:'q_move',done:false},\n    {id:'s7',title:'Dessert',detail:'Duel imposé : glace ou crêpe sucrée…',kind:'forced',ref:'f_dessert',done:false},\n    {id:'s8',title:'Fin de journée',detail:'Contrescarpe ou Luxembourg.',kind:'question',ref:'q_end',done:false},\n  ];\n  o.tested=[{id:'t1',name:'Glace – La Créma',emoji:'🍦'},{id:'t2',name:'Sando pain de mie',emoji:'🥪'},{id:'t3',name:'Hanoi Café',emoji:'🌸'},{id:'t4',name:'Pâte à modeler',emoji:'🎨'},{id:'t5',name:'Jardin du Luxembourg',emoji:'🌳'}];\n  o.tier.host={...emptyTier(),S:['t1'],A:['t2'],B:['t3'],pool:['t4','t5']};\n  o.tier.guest={...emptyTier(),S:['t3'],A:['t1'],C:['t2'],pool:['t4','t5']};\n  o.status='current';\n  return o;\n}\n\nclass Component extends DCLogic {\n  state = {\n    screen:'onboarding',\n    ob:{ step:'welcome', mode:'solo', pseudo:'', partner:'', code:'', password:'', title:'', template:'', action:'create', error:'' },\n    tab:'parcours', room:null, me:'guest', turnPlayer:'guest',\n    play:null, confetti:false, toast:'',\n    editOutingId:null, prepCat:'sale', newItem:{name:'',emoji:''}, newDuel:{a:'',b:''}, newStep:'', editTpl:'',\n    tierView:'host', tierSel:null,\n  };\n  componentDidMount(){\n    let s=null; try{ s=JSON.parse(localStorage.getItem('sortie_session2')||'null'); }catch(e){}\n    if(s && s.code){ const all=this.allRooms(); let room=all[s.code]; if(room){ room=this.normalizeRoom(room); all[s.code]=room; this.saveRooms(all); this.setState({room, me:s.me, turnPlayer: room.mode==='solo'?'guest':s.me, screen:'app', tab: s.me==='host'?'parcours':'live'}); } }\n  }\n  normalizeRoom(r){\n    if(!r) return r;\n    if(!Array.isArray(r.players)) r.players=[{id:'host',name:'Hôte',role:'host'},{id:'guest',name:'Invité·e',role:'guest'}];\n    if(!Array.isArray(r.outings) || r.outings.length===0){ const o=blankOuting(r.title||'Notre sortie'); o.status='current'; r.outings=[o]; r.activeOutingId=o.id; }\n    if(!r.activeOutingId || !r.outings.find(o=>o.id===r.activeOutingId)) r.activeOutingId=r.outings[0].id;\n    r.outings=r.outings.map(o=>({ id:o.id||('o_'+uid()), title:o.title||'Sortie', date:o.date||'', catalog:o.catalog||emptyCatalog(), forced:Array.isArray(o.forced)?o.forced:[], questions:Array.isArray(o.questions)&&o.questions.length?o.questions:defQuestions(), timeline:Array.isArray(o.timeline)?o.timeline:[], answers:o.answers||{}, favorites:o.favorites||{host:{},guest:{}}, tested:Array.isArray(o.tested)?o.tested:[], tier:o.tier||{host:emptyTier(),guest:emptyTier()}, status:o.status||'draft' }));\n    if(!('live' in r)) r.live=null;\n    return r;\n  }\n  allRooms(){ try{return JSON.parse(localStorage.getItem('sortie_rooms2')||'{}')}catch(e){return {}} }\n  saveRooms(o){ try{localStorage.setItem('sortie_rooms2', JSON.stringify(o))}catch(e){} }\n  setRoom(updater){ this.setState(st=>{ const room = typeof updater==='function'?updater(st.room):updater; const all=this.allRooms(); all[room.code]=room; this.saveRooms(all); return {room}; }); }\n  flash(m){ this.setState({toast:m}); clearTimeout(this._t); this._t=setTimeout(()=>this.setState({toast:''}),1700); }\n  burst(){ this.setState({confetti:true}); clearTimeout(this._c); this._c=setTimeout(()=>this.setState({confetti:false}),2000); }\n  randCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)]; return s; }\n  obSet(f,v){ this.setState(st=>({ob:{...st.ob,[f]:v,error:''}})); }\n\n  players(){ return this.state.room? this.state.room.players : [{id:'host',name:'Hôte'},{id:'guest',name:'Invité·e'}]; }\n  pname(id){ const p=this.players().find(x=>x.id===id); return p?p.name:id; }\n  isHost(){ return this.state.me==='host'; }\n  other(id){ return id==='guest'?'host':'guest'; }\n  firstTurn(){ return this.state.room && this.state.room.mode==='solo' ? 'guest' : this.state.me; }\n  activeOuting(){ const r=this.state.room; if(!r||!Array.isArray(r.outings)||!r.outings.length)return null; return r.outings.find(o=>o.id===r.activeOutingId)||r.outings[0]; }\n  editOuting(){ const r=this.state.room; if(!r||!this.state.editOutingId)return null; return r.outings.find(o=>o.id===this.state.editOutingId); }\n  updateOuting(id,fn){ this.setRoom(r=>({...r, outings:r.outings.map(o=>o.id===id?fn(o):o)})); }\n  updateActive(fn){ const a=this.activeOuting(); if(a)this.updateOuting(a.id,fn); }\n  updateEdit(fn){ if(this.state.editOutingId)this.updateOuting(this.state.editOutingId,fn); }\n  enabledItems(cat,o){ o=o||this.activeOuting(); return (o.catalog[cat]||[]).filter(x=>x.enabled); }\n\n  setLive(obj){ this.setRoom(r=>({...r, live:obj})); }\n  shuffleTo(){ t .id===room.activeOutingId?'#f7ddd3':'#f2ece7',\n        border: o.id===room.activeOutingId?'#eecdbf':'#f0e6dd',\n        onSetActive:()=>this.setActiveOuting(o.id), onEdit:()=>this.setState({editOutingId:o.id}), onDelete:()=>this.delOuting(o.id)}));\n      const eo=this.editOuting();\n      if(eo){\n        V.editTitle=eo.title; V.onEditTitle=e=>this.updateEdit(o=>({...o,title:e.target.value}));\n        V.editTplCode=st.editTpl; V.onEditTpl=e=>this.setState({editTpl:e.target.value}); V.importTpl=()=>this.importTpl();\n        V.closeEdit=()=>this.setState({editOutingId:null});\n        V.editSteps=eo.timeline.map(s=>({title:s.title, kindLabel: s.kind==='forced'?'duel imposé':(s.kind==='question'?'question':'lieu'), onUp:()=>this.moveStep(s.id,-1), onDown:()=>this.moveStep(s.id,1), onDelete:()=>this.delStep(s.id)}));\n        V.newStep=st.newStep; V.onNewStep=e=>this.setState({newStep:e.target.value}); V.addStep=()=>this.addStep();\n        V.editNoForced=eo.forced.length===0;\n        V.editForced=eo.forced.map(f=>{ const a=findItem(eo.catalog,f.a)||{}, b=findItem(eo.catalog,f.b)||{}; return {aName:a.name,aEmoji:a.emoji,bName:b.name,bEmoji:b.emoji,onDelete:()=>this.delForced(f.id)}; });\n        V.catTabs=CATS.map(c=>({name:c.name, bg: st.prepCat===c.id?'#c26a4a':'#f4ede6', fg: st.prepCat===c.id?'#fff':'#8b7d74', onPick:()=>this.setState({prepCat:c.id})}));\n        V.catItems=(eo.catalog[st.prepCat]||[]).map(it=>({...it, disabled:!it.enabled, opacity: it.enabled?'1':'.5', lockBg: it.mandatory?'#f7ddd3':'#f4ede6', lockFg: it.mandatory?'#bb4b30':'#c6b4a9', onBg: it.enabled?'#e4ede2':'#f4ede6', onFg: it.enabled?'#5f8a6d':'#c6b4a9', onMandatory:()=>this.toggleMand(it.id), onToggle:()=>this.toggleItem(it.id), onDelete:()=>this.delItem(it.id)}));\n        V.newItem=st.newItem; V.onNewName=e=>this.setState({newItem:{...st.newItem,name:e.target.value}}); V.onNewEmoji=e=>this.setState({newItem:{...st.newItem,emoji:e.target.value}}); V.addItem=()=>this.addItem();\n        V.duelOptions=(eo.catalog[st.prepCat]||[]).map(it=>({id:it.id,label:it.emoji+' '+it.name}));\n        V.newDuel=st.newDuel; V.onDuelA=e=>this.setState({newDuel:{...st.newDuel,a:e.target.value}}); V.onDuelB=e=>this.setState({newDuel:{...st.newDuel,b:e.target.value}}); V.addForced=()=>this.addForced();\n      }\n\n      // results\n      const answeredBoth=Object.values(ao.answers).filter(a=>a.guest!==undefined&&a.host!==undefined);\n      const matches=answeredBoth.filter(a=>a.guest===a.host).length;\n      V.compatPct=(answeredBoth.length? Math.round(matches/answeredBoth.length*100):78)+'%';\n      V.statMatch=matches; V.statTested=ao.tested.length; V.statRedo=2;\n      V.tierWho=this.pname(st.tierView);\n      V.tierPlayers=[['host'],['guest']].map(([id])=>({name:this.pname(id), bg: st.tierView===id?'#c26a4a':'#f4ede6', fg: st.tierView===id?'#fff':'#8b7d74', onPick:()=>this.setState({tierView:id,tierSel:null})}));\n      const tset=ao.tier[st.tierView];\n      const chip=id=>{ const t=ao.tested.find(x=>x.id===id)||{name:id,emoji:'✨'}; const sel=st.tierSel===id; return {emoji:t.emoji,name:t.name, bg: sel?'#c26a4a':'#fff', fg: sel?'#fff':'#584c46', border: sel?'#c26a4a':'#ece0d6', onSelect:(e)=>{e&&e.stopPropagation&&e.stopPropagation(); this.setState({tierSel: sel?null:id});}}; };\n      V.tierRows=RANKS.map(r=>({rank:r,color:RANKC[r],items:(tset[r]||[]).map(chip),onDrop:()=>this.moveTier(r)}));\n      V.tierPool=(tset.pool||[]).map(chip); V.poolEmpty=(tset.pool||[]).length===0;\n      V.onDropPool=()=>{ const sel=st.tierSel; if(!sel)return; this.updateActive(o=>{ const t={...o.tier[st.tierView]}; RANKS.forEach(k=>t[k]=t[k].filter(x=>x!==sel)); if(!t.pool.includes(sel))t.pool=[...t.pool,sel]; return {...o,tier:{...o.tier,[st.tierView]:t}}; }); this.setState({tierSel:null}); };\n      V.tierSelInfo=st.tierSel? ((ao.tested.find(x=>x.id===st.tierSel)||{}).name||''):'';\n      V.profiles=[{name:this.pname('host'),color:'#c26a4a',traits:['les grands jardins','manger sur place','les transports','les crêpes','les activités longues']},{name:this.pname('guest'),color:'#5f8a6d',traits:['les glaces','les petits jardins','à emporter','marcher','les cafés calmes','les desserts frais']}];\n\n      // guest live\n      V.liveOpen=!!room.live; V.liveWait=!room.live;\n      V.liveTitle=room.live? room.live.title : '';\n      V.liveOpenPlay=()=>{ const l=room.live; if(!l)return; if(l.kind==='forced'){ const f=ao.forced.find(x=>x.id===l.refId); if(f)this.startForced(f); } else if(l.kind==='quiz'){ this.startCatQuiz(l.category); } else if(l.kind==='question'){ const q=ao.questions.find(x=>x.id===l.qid); if(q)this.startQuestion(q); } };\n    }\n\n    if(st.confetti){ const cols=['#c26a4a','#d9b45f','#6f9a7d','#d98f5c','#8f83b0']; V.confettiPieces=Array.from({length:24}).map((_,i)=>({color:cols[i%cols.length], left:Math.round(Math.random()*96)+'%', size:(7+Math.random()*7).toFixed(0)+'px', dur:(1.5+Math.random()*1.1).toFixed(2)+'s', delay:(Math.random()*.4).toFixed(2)+'s'})); }\n    return V;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
