<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptous — Duels Culinaires & Sorties</title>
  
  <!-- Load React, ReactDOM and Babel Standalone from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; font-family: 'Quicksand', system-ui, sans-serif; color: #3f3733; background: #e7ded7; }
    a { color: #c26a4a; text-decoration: none; }
    a:hover { color: #a5502f; }
    input, select, textarea, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    svg { display: block; }
    
    .app-frame {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f7f1eb;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 0 0 60px rgba(90,70,55,.12);
      display: flex;
      flex-direction: column;
    }
    
    @keyframes shf { 0%{transform:translate(0,0) rotate(0)} 25%{transform:translate(38px,-14px) rotate(11deg)} 50%{transform:translate(-30px,10px) rotate(-9deg)} 75%{transform:translate(22px,-8px) rotate(6deg)} 100%{transform:translate(0,0) rotate(0)} }
    @keyframes shf2 { 0%{transform:translate(0,0) rotate(0)} 25%{transform:translate(-40px,12px) rotate(-12deg)} 50%{transform:translate(28px,-12px) rotate(10deg)} 75%{transform:translate(-20px,6px) rotate(-7deg)} 100%{transform:translate(0,0) rotate(0)} }
    @keyframes flipIn { 0%{transform:rotateY(90deg);opacity:0} 100%{transform:rotateY(0);opacity:1} }
    @keyframes pop { 0%{transform:scale(.6);opacity:0} 60%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }
    @keyframes conf { 0%{transform:translateY(-10vh) rotate(0);opacity:1} 100%{transform:translateY(105vh) rotate(540deg);opacity:1} }
    @keyframes riseIn { 0%{transform:translateY(16px);opacity:0} 100%{transform:translateY(0);opacity:1} }
    
    .animate-rise { animation: riseIn .4s ease both; }
    .animate-pop { animation: pop .4s ease both; }
    
    .shuffling-1 { animation: shf .8s ease-in-out infinite; }
    .shuffling-2 { animation: shf2 .8s ease-in-out infinite; }

    .btn-primary {
      background: #c26a4a;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(194, 106, 74, .28);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: #a5502f;
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #5f8a6d;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(95, 138, 109, .28);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: #476c53;
      transform: translateY(-1px);
    }
    .btn-secondary:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const APP_KEY = "qlfmu0u7";
    const RANKS = ['S','A','B','C','D','E','F'];
    const RANKC = {S:'#c26a4a',A:'#d98f5c',B:'#d9b45f',C:'#6f9a7d',D:'#6f93a0',E:'#8f83b0',F:'#a99a90'};
    const CATS = [
      {id:'sale', name:'Salé'},{id:'dessert', name:'Dessert'},{id:'lieu', name:'Lieux'},
      {id:'activite', name:'Activités'},{id:'ambiance', name:'Ambiance'},{id:'deplacement', name:'Déplacement'},
    ];

    const uid = () => Math.random().toString(36).slice(2,9);
    const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid();
    const seedItems = (cat, arr) => arr.map(([n,e])=>({id:slug(n), name:n, emoji:e, cat, enabled:true, mandatory:false}));

    function fullCatalog(){
      return {
        sale: seedItems('sale',[['Crêpe salée','🥞'],['Sando pain de mie','🥪'],['Bao','🥟'],['Ramen','🍜'],['Burger','🍔'],['Pizza','🍕'],['Sushi','🍣'],['Curry','🍛'],['Nouilles sautées','🍝'],['Poké','🥗'],['Tacos','🌮'],['Kebab','🥙'],['Gyozas','🥟'],['Onigiri','🍙'],['Bibimbap','🍲'],['Brunch salé','🍳']]),
        dessert: seedItems('dessert',[['Glace','🍦'],['Crêpe sucrée','🥞'],['Gaufre','🧇'],['Cookie','🍪'],['Cheesecake','🍰'],['Mochi','🍡'],['Tiramisu','🍮'],['Bubble tea','🧋'],['Churros','🥨'],['Donut','🍩'],['Brownie','🍫'],['Pâtisserie','🧁'],['Café gourmand','☕'],['Fruit frais','🍓'],['Yaourt glacé','🍨']]),
        lieu: seedItems('lieu',[['Rougier & Plé','🎨'],['Carré Pain de Mie','🥪'],['Jardin Anne Frank','🌳'],['Hanoi Café 1988','🌸'],['La Créma','🍦'],['Jardin du Luxembourg','🌳'],['Place de la Contrescarpe','🏛️'],['Oroyana','🥞']]),
        activite: seedItems('activite',[['Pâte à modeler','🎨'],['Balade','🚶'],['Photo souvenir','📸'],['Deviner l’objet','🔮'],['Objet duo','🧩']]),
        ambiance: seedItems('ambiance',[['Petit jardin','🌱'],['Grand jardin','🌳'],['Petite place vivante','🏛️'],['Café romantique','🌸']]),
        deplacement: seedItems('deplacement',[['Marcher ~30 min','🚶'],['Prendre les transports','🚇']]),
      };
    }

    function emptyCatalog(){ const c={}; CATS.forEach(x=>c[x.id]=[]); return c; }
    function findItem(cat, id){ for(const k in cat){ const f=(cat[k]||[]).find(x=>x.id===id); if(f) return f; } return null; }

    function defQuestions(){
      return [
        {id:'q_place', text:'Pour manger, tu préfères sur place ou à emporter ?', a:{id:'surplace',name:'Sur place',emoji:'🍽️'}, b:{id:'emporter',name:'À emporter',emoji:'🥡'}},
        {id:'q_move', text:'Pour la suite, tu préfères marcher ou aller plus vite ?', a:{id:'marche',name:'Marcher ~30 min',emoji:'🚶'}, b:{id:'transport',name:'Les transports',emoji:'🚇'}},
        {id:'q_end', text:'Fin de journée : petite place animée ou grand jardin calme ?', a:{id:'place',name:'Petite place',emoji:'🏛️'}, b:{id:'jardin',name:'Grand jardin',emoji:'🌳'}},
        {id:'q_after', text:'Après manger, plutôt créer ou te balader ?', a:{id:'creer',name:'Créer',emoji:'🎨'}, b:{id:'balade',name:'Une balade',emoji:'🚶'}},
      ];
    }

    function emptyTier(){ const t={pool:[]}; RANKS.forEach(r=>t[r]=[]); return t; }

    function blankOuting(title){
      return {
        id:'o_'+uid(),
        title: title || 'Nouvelle sortie',
        date: new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}),
        catalog: fullCatalog(),
        forced: [],
        questions: defQuestions(),
        timeline: [],
        answers: {},
        favorites: {},
        tested: [],
        tier: {},
        status: 'draft'
      };
    }

    function templateOuting(title){
      const cat = fullCatalog();
      const o = blankOuting(title);
      o.catalog = cat;
      o.forced = [
        {id:'f_plat',cat:'sale',a:'crepe-salee',b:'sando-pain-de-mie',mandatory:true},
        {id:'f_dessert',cat:'dessert',a:'glace',b:'crepe-sucree',mandatory:true}
      ];
      o.timeline = [
        {id:'s1',title:'Rougier & Plé',detail:'Acheter de quoi fabriquer ensemble.',kind:'place',ref:null,done:false},
        {id:'s2',title:'Choix du déjeuner',detail:'Duel imposé : le gagnant reste.',kind:'forced',ref:'f_plat',done:false},
        {id:'s3',title:'Sur place ou à emporter',detail:'Une question rapide.',kind:'question',ref:'q_place',done:false},
        {id:'s4',title:'Jardin Anne Frank',detail:'Si repas à emporter — coin tranquille.',kind:'place',ref:null,done:false},
        {id:'s5',title:'Hanoi Café 1988',detail:'Pause créative · pâte à modeler.',kind:'place',ref:null,done:false},
        {id:'s6',title:'Déplacement dessert',detail:'Marche ou transports.',kind:'question',ref:'q_move',done:false},
        {id:'s7',title:'Dessert',detail:'Duel imposé : glace ou crêpe sucrée…',kind:'forced',ref:'f_dessert',done:false},
        {id:'s8',title:'Fin de journée',detail:'Contrescarpe ou Luxembourg.',kind:'question',ref:'q_end',done:false},
      ];
      o.status = 'current';
      return o;
    }

    // Cloud helper APIs
    async function getBlobIdFromCode(code) {
      try {
        const res = await fetch(`https://keyvalue.immanuel.co/api/KeyVal/GetValue/${APP_KEY}/${code.toUpperCase()}`);
        if (!res.ok) return null;
        const txt = await res.text();
        return txt ? txt.replace(/^"|"$/g, '') : null;
      } catch (e) {
        return null;
      }
    }

    async function setBlobIdForCode(code, blobId) {
      try {
        const res = await fetch(`https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/${APP_KEY}/${code.toUpperCase()}/${blobId}`, {
          method: 'POST',
          body: ''
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    async function createRoomCloud(room) {
      try {
        const res = await fetch(`https://jsonblob.com/api/jsonBlob`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(room)
        });
        if (!res.ok) return null;
        const blobId = res.headers.get('X-jsonblob-id') || res.headers.get('Location').split('/').pop();
        if (blobId) {
          await setBlobIdForCode(room.code, blobId);
          return blobId;
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    async function uploadRoom(blobId, room) {
      try {
        const res = await fetch(`https://jsonblob.com/api/jsonBlob/${blobId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(room)
        });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    async function downloadRoom(blobId) {
      try {
        const res = await fetch(`https://jsonblob.com/api/jsonBlob/${blobId}`);
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    function App() {
      const [screen, setScreen] = useState('onboarding');
      const [loading, setLoading] = useState(false);
      
      // Onboarding state
      const [obStep, setObStep] = useState('welcome');
      const [obPseudo, setObPseudo] = useState('');
      const [obPartner, setObPartner] = useState('');
      const [obCode, setObCode] = useState('');
      const [obPassword, setObPassword] = useState('');
      const [obTitle, setObTitle] = useState('');
      const [obTemplate, setObTemplate] = useState('');
      const [obAction, setObAction] = useState('create');
      const [obMode, setObMode] = useState('duo');
      const [obError, setObError] = useState('');

      // Application State
      const [room, setRoom] = useState(null);
      const [me, setMe] = useState(null); // Player ID
      const [blobId, setBlobId] = useState(null);
      const [tab, setTab] = useState('parcours');
      const [toast, setToast] = useState('');
      const [confetti, setConfetti] = useState(false);
      const [play, setPlay] = useState(null); // Active game state
      const [turnPlayer, setTurnPlayer] = useState(null); // Solo active player
      const [expandedSteps, setExpandedSteps] = useState({});
      const [settingsOpen, setSettingsOpen] = useState(false);

      // Editor State
      const [editOutingId, setEditOutingId] = useState(null);
      const [prepCat, setPrepCat] = useState('sale');
      const [newItemName, setNewItemName] = useState('');
      const [newItemEmoji, setNewItemEmoji] = useState('');
      const [newDuelA, setNewDuelA] = useState('');
      const [newDuelB, setNewDuelB] = useState('');
      const [editTpl, setEditTpl] = useState('');
      
      // Selectors for creating timeline steps
      const [newStepKind, setNewStepKind] = useState('place');
      const [newStepTitle, setNewStepTitle] = useState('');
      const [newStepRef, setNewStepRef] = useState('');

      // Tier list State
      const [tierPlayerId, setTierPlayerId] = useState('');
      const [tierSelItemId, setTierSelItemId] = useState(null);

      // Refs
      const timerRef = useRef(null);
      const isWritingRef = useRef(false);

      const flash = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 2000);
      };

      const triggerConfetti = () => {
        setConfetti(true);
        setTimeout(() => setConfetti(false), 2000);
      };

      // Check session on mount
      useEffect(() => {
        const session = localStorage.getItem('sortie_session2');
        if (session) {
          try {
            const { code, me: playerMe, blobId: sessionBlobId } = JSON.parse(session);
            setLoading(true);
            downloadRoom(sessionBlobId).then(fetchedRoom => {
              if (fetchedRoom) {
                setRoom(fetchedRoom);
                setMe(playerMe);
                setBlobId(sessionBlobId);
                const isHost = fetchedRoom.players.find(p => p.id === playerMe)?.role === 'host';
                setTab(isHost ? 'parcours' : 'live');
                setScreen('app');
                setTurnPlayer(playerMe);
              }
              setLoading(false);
            });
          } catch(e) {
            setLoading(false);
          }
        }
      }, []);

      // Realtime polling
      useEffect(() => {
        if (screen === 'app' && blobId) {
          timerRef.current = setInterval(async () => {
            if (isWritingRef.current) return;
            const updated = await downloadRoom(blobId);
            if (updated) {
              // Deep compare room
              if (JSON.stringify(updated) !== JSON.stringify(room)) {
                setRoom(updated);
                
                // If live state has changed, sync local play state
                if (updated.live) {
                  // Only set local play if not playing already or different
                  if (!play || play.refId !== updated.live.refId || play.qid !== updated.live.qid) {
                    initPlayFromLive(updated.live, updated);
                  }
                } else {
                  setPlay(null);
                }
              }
            }
          }, 3000);
        }
        return () => clearInterval(timerRef.current);
      }, [screen, blobId, room, play]);

      const writeRoomToCloud = async (updatedRoom) => {
        isWritingRef.current = true;
        setRoom(updatedRoom);
        await uploadRoom(blobId, updatedRoom);
        isWritingRef.current = false;
      };

      const randCode = () => {
        const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let s = '';
        for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)];
        return s;
      };

      const handleCreateRoom = async () => {
        if (!obPseudo.trim()) {
          setObError("Un pseudo est requis");
          return;
        }
        setLoading(true);
        const code = randCode();
        setObCode(code);
        setObPassword('1234'); // Simple default password
        setObTitle(obTitle || 'Balade gourmande');
        setObStep('create');
        setLoading(false);
      };

      const goToModeSelect = () => {
        if (!obPassword.trim()) {
          setObError("Mot de passe obligatoire");
          return;
        }
        setObStep('mode');
      };

      const finishCreateRoom = async () => {
        setLoading(true);
        const hostId = 'p_' + uid();
        const guestId = 'p_' + uid();
        const players = [{ id: hostId, name: obPseudo.trim(), role: 'host' }];
        if (obMode === 'solo') {
          players.push({ id: guestId, name: obPartner.trim() || 'Invité·e', role: 'guest' });
        }
        
        const firstOuting = obTemplate.trim() === '1812' ? templateOuting(obTitle) : blankOuting(obTitle);
        firstOuting.status = 'current';

        const newRoom = {
          code: obCode.toUpperCase(),
          password: obPassword,
          mode: obMode,
          players,
          outings: [firstOuting],
          activeOutingId: firstOuting.id,
          live: null
        };

        const cloudId = await createRoomCloud(newRoom);
        if (!cloudId) {
          setObError("Impossible de créer la room");
          setLoading(false);
          return;
        }

        setBlobId(cloudId);
        setRoom(newRoom);
        
        const startMe = obMode === 'solo' ? guestId : hostId;
        setMe(startMe);
        setTurnPlayer(startMe);
        
        localStorage.setItem('sortie_session2', JSON.stringify({ code: newRoom.code, me: startMe, blobId: cloudId }));
        setScreen('app');
        setTab(obMode === 'solo' ? 'live' : 'parcours');
        setLoading(false);
        flash("Room créée !");
      };

      const handleJoinRoom = async () => {
        if (!obPseudo.trim()) {
          setObError("Un pseudo est requis");
          return;
        }
        if (!obCode || obCode.length < 4) {
          setObError("Code de room invalide");
          return;
        }
        setLoading(true);
        const cloudId = await getBlobIdFromCode(obCode);
        if (!cloudId) {
          setObError("Room introuvable");
          setLoading(false);
          return;
        }
        const fetchedRoom = await downloadRoom(cloudId);
        if (!fetchedRoom) {
          setObError("Erreur lors du téléchargement de la room");
          setLoading(false);
          return;
        }
        if (fetchedRoom.password !== obPassword) {
          setObError("Mot de passe incorrect");
          setLoading(false);
          return;
        }

        const guestId = 'p_' + uid();
        const updatedPlayers = [...fetchedRoom.players, { id: guestId, name: obPseudo.trim(), role: 'guest' }];
        const updatedRoom = { ...fetchedRoom, players: updatedPlayers };

        const ok = await uploadRoom(cloudId, updatedRoom);
        if (!ok) {
          setObError("Erreur d'écriture sur le serveur");
          setLoading(false);
          return;
        }

        setBlobId(cloudId);
        setRoom(updatedRoom);
        setMe(guestId);
        setTurnPlayer(guestId);
        localStorage.setItem('sortie_session2', JSON.stringify({ code: updatedRoom.code, me: guestId, blobId: cloudId }));
        setScreen('app');
        setTab('live');
        setLoading(false);
        flash(`Connecté dans la room ${updatedRoom.code} !`);
      };

      const handleLogOut = () => {
        localStorage.removeItem('sortie_session2');
        setRoom(null);
        setMe(null);
        setBlobId(null);
        setScreen('onboarding');
        setObStep('welcome');
        setSettingsOpen(false);
        flash("Déconnecté");
      };

      const switchSoloTurn = () => {
        const hostPlayer = room.players.find(p => p.role === 'host');
        const guestPlayer = room.players.find(p => p.role === 'guest');
        if (!hostPlayer || !guestPlayer) return;
        
        const nextMe = me === hostPlayer.id ? guestPlayer.id : hostPlayer.id;
        setMe(nextMe);
        setTurnPlayer(nextMe);
        
        const nextTab = nextMe === hostPlayer.id ? 'parcours' : 'live';
        setTab(nextTab);
        
        flash(`C'est au tour de ${nextMe === hostPlayer.id ? hostPlayer.name : guestPlayer.name} !`);
      };

      const changeRole = (pId, newRole) => {
        const updated = {
          ...room,
          players: room.players.map(p => p.id === pId ? { ...p, role: newRole } : p)
        };
        writeRoomToCloud(updated);
        flash("Rôle mis à jour");
      };

      const renamePlayer = (pId, newName) => {
        if (!newName.trim()) return;
        const updated = {
          ...room,
          players: room.players.map(p => p.id === pId ? { ...p, name: newName.trim() } : p)
        };
        writeRoomToCloud(updated);
        flash("Pseudo mis à jour");
      };

      const kickPlayer = (pId) => {
        const updated = {
          ...room,
          players: room.players.filter(p => p.id !== pId)
        };
        writeRoomToCloud(updated);
        flash("Participant exclu");
      };

      const activeOuting = () => {
        if (!room || !room.outings || !room.outings.length) return null;
        return room.outings.find(o => o.id === room.activeOutingId) || room.outings[0];
      };

      const updateActiveOuting = (fn) => {
        const ao = activeOuting();
        if (!ao) return;
        const updatedOuting = fn(ao);
        const updatedRoom = {
          ...room,
          outings: room.outings.map(o => o.id === ao.id ? updatedOuting : o)
        };
        writeRoomToCloud(updatedRoom);
      };

      const updateEditOuting = (fn) => {
        if (!editOutingId) return;
        const currentEdit = room.outings.find(o => o.id === editOutingId);
        if (!currentEdit) return;
        const updatedOuting = fn(currentEdit);
        const updatedRoom = {
          ...room,
          outings: room.outings.map(o => o.id === editOutingId ? updatedOuting : o)
        };
        writeRoomToCloud(updatedRoom);
      };

      // Play trigger mechanism
      const initPlayFromLive = (live, customRoom) => {
        const r = customRoom || room;
        const ao = r.outings.find(o => o.id === r.activeOutingId);
        if (!ao) return;

        if (live.kind === 'question') {
          const q = ao.questions.find(x => x.id === live.qid);
          if (q) {
            setPlay({
              kind: 'question',
              qid: q.id,
              options: [q.a, q.b],
              title: q.text,
              phase: 'ready',
              player: me
            });
          }
        } else if (live.kind === 'forced') {
          const f = ao.forced.find(x => x.id === live.refId);
          if (f) {
            let rest = (ao.catalog[f.cat] || []).filter(x => x.enabled).map(x => ({ id: x.id, name: x.name, emoji: x.emoji }));
            if (rest.length < 2) return;
            const itemA = findItem(ao.catalog, f.a);
            const itemB = findItem(ao.catalog, f.b);
            
            rest = rest.filter(x => x.id !== f.a && x.id !== f.b);
            const shuffledOptions = Math.random() < 0.5 
              ? [{ id: itemA.id, name: itemA.name, emoji: itemA.emoji }, { id: itemB.id, name: itemB.name, emoji: itemB.emoji }]
              : [{ id: itemB.id, name: itemB.name, emoji: itemB.emoji }, { id: itemA.id, name: itemA.name, emoji: itemA.emoji }];

            setPlay({
              kind: 'quiz',
              category: f.cat,
              deck: rest,
              champ: shuffledOptions[0],
              options: shuffledOptions,
              round: 1,
              title: 'Duel imposé',
              refId: f.id,
              phase: 'ready',
              player: me
            });
          }
        } else if (live.kind === 'quiz') {
          let rest = (ao.catalog[live.category] || []).filter(x => x.enabled).map(x => ({ id: x.id, name: x.name, emoji: x.emoji }));
          if (rest.length < 2) return;
          for (let i = rest.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [rest[i], rest[j]] = [rest[j], rest[i]];
          }
          const champ = rest.shift();
          const chall = rest.shift();
          setPlay({
            kind: 'quiz',
            category: live.category,
            deck: rest,
            champ,
            options: [champ, chall],
            round: 1,
            title: 'Duel de goûts',
            phase: 'ready',
            player: me
          });
        }
      };

      const launchStep = (step) => {
        const ao = activeOuting();
        let liveObj = null;
        if (step.kind === 'forced') {
          const f = ao.forced.find(x => x.id === step.ref);
          if (f) liveObj = { kind: 'forced', refId: f.id, title: step.title };
        } else if (step.kind === 'question') {
          const q = ao.questions.find(x => x.id === step.ref);
          if (q) liveObj = { kind: 'question', qid: q.id, title: q.text };
        } else if (step.kind === 'quiz') {
          liveObj = { kind: 'quiz', category: step.ref, title: step.title };
        }

        if (liveObj) {
          const updated = { ...room, live: liveObj };
          writeRoomToCloud(updated);
          flash("Activité lancée ! Les participants peuvent y répondre.");
        }
      };

      const pickCard = (cardId) => {
        if (!play) return;
        if (play.kind === 'quiz') {
          const champ = play.options.find(o => o.id === cardId);
          if (play.deck.length > 0) {
            const deck = [...play.deck];
            const chall = deck.shift();
            
            // Trigger quick shuffle visual transition
            setPlay({ ...play, phase: 'shuffle' });
            setTimeout(() => {
              setPlay({
                ...play,
                champ,
                deck,
                options: [champ, chall],
                round: play.round + 1,
                phase: 'ready'
              });
            }, 800);
          } else {
            setPlay({ ...play, champ, phase: 'done' });
            triggerConfetti();
          }
        } else {
          // Question or single pick
          const pick = play.options.find(o => o.id === cardId);
          setPlay({ ...play, pick, phase: 'answered' });
        }
      };

      const rerollPlay = () => {
        if (!play) return;
        if (play.kind === 'quiz') {
          if (play.deck.length > 0) {
            const deck = [...play.deck];
            const j = Math.floor(Math.random() * deck.length);
            const chall = deck.splice(j, 1)[0];
            setPlay({ ...play, phase: 'shuffle' });
            setTimeout(() => {
              setPlay({ ...play, deck, options: [play.champ, chall], phase: 'ready' });
            }, 800);
          } else {
            setPlay({ ...play, phase: 'shuffle' });
            setTimeout(() => {
              setPlay({ ...play, phase: 'ready' });
            }, 800);
          }
        } else {
          setPlay({ ...play, phase: 'shuffle', pick: null });
          setTimeout(() => {
            setPlay({ ...play, options: [...play.options].reverse(), phase: 'ready' });
          }, 800);
        }
      };

      const playSave = () => {
        const ao = activeOuting();
        if (!play || !ao) return;

        let updatedRoom = { ...room };
        const outingIdx = room.outings.findIndex(o => o.id === ao.id);
        const currentOuting = { ...room.outings[outingIdx] };

        if (play.kind === 'question' && play.pick) {
          const currentAnswers = currentOuting.answers[play.qid] || {};
          currentAnswers[me] = play.pick.id;
          currentOuting.answers[play.qid] = currentAnswers;
        } else if (play.kind === 'quiz' && play.champ) {
          const currentFavs = currentOuting.favorites[me] || {};
          currentFavs[play.category] = play.champ.id;
          currentOuting.favorites[me] = currentFavs;
        }

        updatedRoom.outings[outingIdx] = currentOuting;
        
        // Remove live status once I answer locally
        // (Other players can still answer if it remains live, but I close my view)
        setPlay(null);
        writeRoomToCloud(updatedRoom);
        flash("Choix enregistré !");
      };

      const closePlay = () => {
        setPlay(null);
      };

      // Finish Outing & Populate Tier List Pool
      const finishDay = () => {
        const ao = activeOuting();
        if (!ao) return;

        const collectedTested = [...ao.tested];

        // 1. Collect completed place steps
        ao.timeline.forEach(s => {
          if (s.kind === 'place' && s.done) {
            if (!collectedTested.find(t => t.id === s.id)) {
              collectedTested.push({ id: s.id, name: s.title, emoji: '📍' });
            }
          }
        });

        // 2. Collect answered questions options
        ao.timeline.forEach(s => {
          if (s.kind === 'question' && s.done) {
            const q = ao.questions.find(x => x.id === s.ref);
            const ansObj = ao.answers[s.ref] || {};
            if (q) {
              Object.values(ansObj).forEach(valId => {
                const opt = q.a.id === valId ? q.a : (q.b.id === valId ? q.b : null);
                if (opt && !collectedTested.find(t => t.id === opt.id)) {
                  collectedTested.push({ id: opt.id, name: opt.name, emoji: opt.emoji });
                }
              });
            }
          }
        });

        // 3. Collect completed forced/quiz duels favorites
        room.players.forEach(p => {
          const favs = ao.favorites[p.id] || {};
          Object.entries(favs).forEach(([catId, itemId]) => {
            const item = findItem(ao.catalog, itemId);
            if (item && !collectedTested.find(t => t.id === item.id)) {
              collectedTested.push({ id: item.id, name: item.name, emoji: item.emoji });
            }
          });
        });

        // Initialize players tier lists
        const updatedTier = { ...ao.tier };
        room.players.forEach(p => {
          // If no tier list exists, or to update the pool of remaining unranked tested items
          const existing = updatedTier[p.id] || emptyTier();
          const ranked = [];
          RANKS.forEach(r => {
            if (existing[r]) ranked.push(...existing[r]);
          });
          const newPool = collectedTested.map(t => t.id).filter(id => !ranked.includes(id));
          updatedTier[p.id] = {
            ...existing,
            pool: newPool,
            ...RANKS.reduce((acc, r) => ({ ...acc, [r]: existing[r] || [] }), {})
          };
        });

        updateActiveOuting(o => ({
          ...o,
          status: 'done',
          tested: collectedTested,
          tier: updatedTier
        }));

        triggerConfetti();
        flash("La journée est terminée ! Tier lists débloquées !");
      };

      const moveTierItem = (rank) => {
        if (!tierSelItemId) return;
        const ao = activeOuting();
        if (!ao) return;

        const updatedTier = { ...ao.tier[tierPlayerId] };
        
        // Remove item from pool and all ranks
        updatedTier.pool = (updatedTier.pool || []).filter(id => id !== tierSelItemId);

          updatedTier[r] = (updatedTier[r] || []).filter(id => id !== tierSelItemId);
        });

        // Insert into targeted rank
        if (rank === 'pool') {
          updatedTier.pool.push(tierSelItemId);
        } else {
          updatedTier[rank].push(tierSelItemId);
        }

        updateActiveOuting(o => ({

          tier: {

            [tierPlayerId]: updatedTier

        setTierSelItemId(null);

                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="18.5" r="2.3"/><circle cx="18" cy="5.5" r="2.3"/><path d="M8.2 17.6h6a3.1 3.1 0 0 0 0-6.2h-4.4a3.1 3.1 0 0 1 0-6.2H16"/></svg>

                              style={{width:'100%',padding:'8px 10px',border:'1px solid #ece0d6',borderRadius:'8px',fontSize:'13px',outline:'none'}}

                          </button>
                        </div>

                        let statusLabel = 'à faire';

                          sb = '#fbefd9';

                          sf = '#5f86a8';
                          sb = '#e7f0f6';

                          statusLabel = 'terminé';
                          sf = '#4c7d5b';
                          sb = '#e4ede2';
                        }

                                      const qObj = activeOuting().questions.find(x => x.id === s.ref);

                                        const opt = qObj.a.id === ansVal ? qObj.a : (qObj.b.id === ansVal ? qObj.b : null);

                                      const fObj = activeOuting().forced.find(x => x.id === s.ref);

                        <p style={{fontSize:'13.5px',margin:'8px 30px 0'}}>L'hôte lancera les cartes d'activités au fil de la journée. Les choix s'afficheront en temps réel ici.</p>
                      </div>

                                    return;
                                  }
                                  const list = room.outings.filter(x => x.id !== o.id);
                                  const activeId = room.activeOutingId === o.id ? list[0].id : room.activeOutingId;
                                  writeRoomToCloud({ ...room, outings: list, activeOutingId: activeId });

                            </div>
                          ))}
                        </div>
                      </div>
                    ) : (

                      <div>
                        <button onClick={() => setEditOutingId(null)} style={{background:'none',border:'none',color:'#a89a90',fontSize:'14px',padding:0,cursor:'pointer',marginBottom:'14px'}}>← toutes les sorties</button>
                        <div style={{fontFamily:'"Instrument Serif", serif',fontSize:'24px',marginBottom:'12px'}}>Modifier la sortie</div>

                          };
                          setRoom(updated);
                        }} style={{width:'100%',padding:'11px 13px',border:'2px solid #ece0d6',borderRadius:'12px',fontSize:'14px',background:'#fff',outline:'none',margin:'6px 0 8px'}}/>
                        
                        <div style={{display:'flex',gap:'8px',marginBottom:'18px'}}>
                          <input value={editTpl} onChange={e => setEditTpl(e.target.value)} placeholder="code modèle" style={{flex:1,padding:'10px 12px',border:'2px dashed #e0cdc0',borderRadius:'11px',fontSize:'13px',background:'#fbf5f0',outline:'none'}}/>

                                  writeRoomToCloud({ ...room, outings: room.outings.map(o => o.id === editOutingId ? { ...o, timeline: list } : o) });

                              }} style={{background:'#f4ede6',border:'none',color:'#7a6c64',width:'26px',height:'26px',borderRadius:'7px',cursor:'pointer'}}>↑</button>

                                  writeRoomToCloud({ ...room, outings: room.outings.map(o => o.id === editOutingId ? { ...o, timeline: list } : o) });

                              }} style={{background:'#f4ede6',border:'none',color:'#7a6c64',width:'26px',height:'26px',borderRadius:'7px',cursor:'pointer'}}>↓</button>
                              
                              <button onClick={() => {
                                const current = room.outings.find(o => o.id === editOutingId);
                                const list = current.timeline.filter(x => x.id !== s.id);

                            <option value="question">Question</option>

                            </select>
                          )}

                                const itemB = findItem(room.outings.find(o=>o.id===editOutingId)?.catalog, f.b);

                            </select>

                              <div key={f.id} style={{background:'#fff',border:'1px solid #f2ddd3',borderRadius:'12px',padding:'10px 12px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                                <div style={{fontSize:'13px',fontWeight:'600'}}>{a.emoji} {a.name} <span style={{color:'#cbb6ab'}}>vs</span> {b.emoji} {b.name}</div>

                                  const updated = {
                                    ...room,
                                    outings: room.outings.map(o => o.id === editOutingId ? {
                                      ...o,
                                      forced: o.forced.filter(x => x.id !== f.id)
                                    } : o)
                                  };
                                  writeRoomToCloud(updated);
                                }} style={{background:'none',border:'none',color:'#c0a99e',fontSize:'15px',cursor:'pointer'}}>×</button>
                              </div>
                            );
                          })}
                        </div>
                        
                        <div style={{background:'#fbf5f0',border:'1px dashed #e0cdc0',borderRadius:'12px',padding:'11px',marginBottom:'20px'}}>
                          <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                            <select value={newDuelA} onChange={e => setNewDuelA(e.target.value)} style={{flex:1,padding:'9px',border:'1px solid #eeddd3',borderRadius:'9px',background:'#fff',fontSize:'12.5px'}}>
                              <option value="">1er élément...</option>
                              {(room.outings.find(o=>o.id===editOutingId)?.catalog[prepCat] || []).map(it => (
                                <option key={it.id} value={it.id}>{it.emoji} {it.name}</option>
                              ))}
                            </select>
                            <span style={{color:'#cbb6ab',fontSize:'12px'}}>vs</span>
                            <select value={newDuelB} onChange={e => setNewDuelB(e.target.value)} style={{flex:1,padding:'9px',border:'1px solid #eeddd3',borderRadius:'9px',background:'#fff',fontSize:'12.5px'}}>
                              <option value="">2e élément...</option>
                              {(room.outings.find(o=>o.id===editOutingId)?.catalog[prepCat] || []).map(it => (
                                <option key={it.id} value={it.id}>{it.emoji} {it.name}</option>
                              ))}
                            </select>
                          </div>
                          <button onClick={addForcedDuel} style={{marginTop:'9px',width:'100%',background:'#c26a4a',color:'#fff',border:'none',borderRadius:'10px',padding:'9px',fontSize:'13px',fontWeight:'700',cursor:'pointer'}}>
                            + ajouter ce duel imposé
                          </button>
                        </div>

                          {CATS.map(c => (
                            <button key={c.id} onClick={() => setPrepCat(c.id)} style={{whiteSpace:'nowrap',background: prepCat===c.id?'#c26a4a':'#f4ede6',color: prepCat===c.id?'#fff':'#8b7d74',border:'none',padding:'8px 14px',borderRadius:'11px',fontSize:'13px',fontWeight:'600',cursor:'pointer'}}>
                              {c.name}
                            </button>
                          ))}
                        </div>

                        <div style={{display:'flex',flexDirection:'column',gap:'7px'}}>
                          {(room.outings.find(o=>o.id===editOutingId)?.catalog[prepCat] || []).map(it => (

                                const current = room.outings.find(o => o.id === editOutingId);
                                const list = current.catalog[prepCat].map(x => x.id === it.id ? { ...x, mandatory: !x.mandatory } : x);
                                writeRoomToCloud({
                                  ...room,
                                  outings: room.outings.map(o => o.id === editOutingId ? {
                                    ...o,
                                    catalog: { ...o.catalog, [prepCat]: list }
                                  } : o)
                                });
                              }} title="obligatoire" style={{background: it.mandatory?'#f7ddd3':'#f4ede6',border:'none',color: it.mandatory?'#bb4b30':'#c6b4a9',width:'30px',height:'30px',borderRadius:'9px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
                              
                              <button onClick={() => {
                                const current = room.outings.find(o => o.id === editOutingId);
                                const list = current.catalog[prepCat].map(x => x.id === it.id ? { ...x, enabled: !x.enabled } : x);
                                writeRoomToCloud({
                                  ...room,
                                  outings: room.outings.map(o => o.id === editOutingId ? {
                                    ...o,
                                    catalog: { ...o.catalog, [prepCat]: list }
                                  } : o)
                                });
                              }} title="activer/désactiver" style={{background: it.enabled?'#e4ede2':'#f4ede6',border:'none',color: it.enabled?'#5f8a6d':'#c6b4a9',width:'30px',height:'30px',borderRadius:'9px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>

                                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="7"/></svg>
                                )}

                              <button onClick={() => {
                                const current = room.outings.find(o => o.id === editOutingId);
                                const list = current.catalog[prepCat].filter(x => x.id !== it.id);
                                writeRoomToCloud({
                                  ...room,
                                  outings: room.outings.map(o => o.id === editOutingId ? {
                                    ...o,
                                    catalog: { ...o.catalog, [prepCat]: list }
                                  } : o)
                                });
                              }} style={{background:'none',border:'none',color:'#c0a99e',fontSize:'15px',cursor:'pointer'}}>×</button>
                            </div>

                        <div style={{background:'#fbf5f0',border:'1px dashed #e0cdc0',borderRadius:'12px',padding:'11px',marginTop:'12px',display:'flex',gap:'8px'}}>

                          <button onClick={addCatalogItem} style={{background:'#5f8a6d',color:'#fff',border:'none',borderRadius:'9px',padding:'0 16px',fontSize:'14px',fontWeight:'700',cursor:'pointer'}}>+</button>
                        </div>
                      </div>

                  </div>

                    {/* STATS HEADER */}
                    <div style={{background:'#f6e5db',borderRadius:'18px',padding:'18px',marginBottom:'18px',textAlign:'center'}}>
                      <div style={{fontSize:'13px',color:'#a5502f',fontWeight:'600'}}>Compatibilité globale</div>
                      
                      {/* Calculate compatibility */}
                      {(() => {
                        const answeredBoth = Object.values(activeOuting()?.answers || {}).filter(a => Object.keys(a).length > 1);
                        const matches = answeredBoth.filter(a => {
                          const values = Object.values(a);
                          return values.every(v => v === values[0]);
                        }).length;
                        const pct = answeredBoth.length ? Math.round(matches / answeredBoth.length * 100) : 78;
                        return (
                          <div>
                            <div style={{fontFamily:'"Instrument Serif", serif',fontSize:'50px',color:'#c26a4a',lineHeight:'1'}}>{pct}%</div>
                            <div style={{display:'flex',justifyContent:'center',gap:'16px',marginTop:'8px',fontSize:'12px',color:'#7a6c64'}}>
                              <div><b>{matches}</b> choix identiques</div>
                              <div><b>{activeOuting()?.tested.length}</b> éléments testés</div>
                            </div>
                          </div>
                        );
                      })()}
                    </div>

                    {/* TIER LIST SECTION */}
                    {activeOuting()?.status !== 'done' ? (
                      <div style={{background:'#fff',border:'1px solid #f0e6dd',borderRadius:'18px',padding:'24px 18px',textAlign:'center',boxShadow:'0 4px 14px rgba(160,120,90,.05)',marginBottom:'20px'}}>
                        <div style={{fontSize:'36px',marginBottom:'10px'}}>🔒</div>
                        <div style={{fontFamily:'"Instrument Serif", serif',fontSize:'22px',color:'#3f3733',marginBottom:'6px'}}>Tier List Bloquée</div>
                        <p style={{color:'#8b7d74',fontSize:'13.5px',margin:'0 0 18px',lineHeight:'1.4'}}>La tier list de la journée sera déverrouillée une fois la sortie terminée. Profitez de votre balade !</p>
                        {isMeHost && (
                          <button onClick={finishDay} className="btn-secondary" style={{padding:'12px 24px',fontSize:'14px'}}>
                            Terminer la journée
                          </button>
                        )}
                      </div>
                    ) : (
                      <div>
                        {/* Player selection for Tier List */}
                        <div style={{fontWeight:'700',fontSize:'14px',marginBottom:'8px'}}>
                          Tier list — <span style={{color:'#c26a4a'}}>{room.players.find(p => p.id === (tierPlayerId || me))?.name}</span>
                        </div>
                        <div style={{display:'flex',gap:'7px',marginBottom:'12px'}}>
                          {room.players.map(p => (
                            <button key={p.id} onClick={() => { setTierPlayerId(p.id); setTierSelItemId(null); }} style={{flex:1,background: (tierPlayerId || me) === p.id ? '#c26a4a':'#f4ede6',color: (tierPlayerId || me) === p.id ? '#fff':'#8b7d74',border:'none',padding:'8px',borderRadius:'10px',fontSize:'13px',fontWeight:'700',cursor:'pointer'}}>
                              {p.name}
                            </button>
                          ))}
                        </div>

                        {tierSelItemId && (tierPlayerId || me) === me && (
                          <div style={{fontSize:'12px',color:'#c26a4a',marginBottom:'8px',textAlign:'center'}}>
                            Sélectionné : {(activeOuting().tested.find(x => x.id === tierSelItemId) || {}).name} — Touche une ligne ci-dessous pour le classer
                          </div>
                        )}

                        {/* Ranks rows */}
                        <div style={{display:'flex',flexDirection:'column',gap:'5px',marginBottom:'14px'}}>
                          {RANKS.map(rank => {
                            const isEditable = (tierPlayerId || me) === me;
                            const items = activeOuting().tier[tierPlayerId || me]?.[rank] || [];
                            return (
                              <div key={rank} onClick={() => { if(isEditable) moveTierItem(rank); }} style={{display:'flex',alignItems:'stretch',borderRadius:'11px',overflow:'hidden',minHeight:'46px',cursor: isEditable ? 'pointer' : 'default',background:'#fff',border:'1px solid #f2ebe4'}}>
                                <div style={{width:'44px',background:RANKC[rank],color:'#fff',fontWeight:'800',fontSize:'18px',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{rank}</div>
                                <div style={{flex:1,display:'flex',flexWrap:'wrap',gap:'5px',padding:'7px',alignItems:'center'}}>
                                  {items.map(itemId => {
                                    const tObj = activeOuting().tested.find(x => x.id === itemId) || { name: itemId, emoji: '✨' };
                                    const isSelected = tierSelItemId === itemId;
                                    return (
                                      <span key={itemId} onClick={(e) => { e.stopPropagation(); if(isEditable) setTierSelItemId(isSelected ? null : itemId); }} style={{background: isSelected ? '#c26a4a':'#fff',border:`1.5px solid ${isSelected ? '#c26a4a':'#ece0d6'}`,color: isSelected ? '#fff':'#584c46',fontSize:'12px',padding:'4px 8px',borderRadius:'8px',fontWeight:'600'}}>
                                        {tObj.emoji} {tObj.name}
                                      </span>
                                    );
                                  })}
                                </div>
                              </div>
                            );
                          })}
                        </div>

                        {/* Unranked items pool */}
                        <div style={{background:'#f7f0ea',borderRadius:'13px',padding:'10px',marginBottom:'20px'}}>
                          <div style={{fontSize:'12px',color:'#a2938a',fontWeight:'600',marginBottom:'6px'}}>À classer</div>
                          <div onClick={() => { if((tierPlayerId || me) === me) moveTierItem('pool'); }} style={{display:'flex',flexWrap:'wrap',gap:'6px',minHeight:'28px',cursor:'pointer'}}>
                            {(activeOuting().tier[tierPlayerId || me]?.pool || []).map(itemId => {
                              const tObj = activeOuting().tested.find(x => x.id === itemId) || { name: itemId, emoji: '✨' };
                              const isSelected = tierSelItemId === itemId;
                              return (
                                <span key={itemId} onClick={(e) => { e.stopPropagation(); if((tierPlayerId || me) === me) setTierSelItemId(isSelected ? null : itemId); }} style={{background: isSelected ? '#c26a4a':'#fff',border:`1.5px solid ${isSelected ? '#c26a4a':'#ece0d6'}`,color: isSelected ? '#fff':'#584c46',fontSize:'12.5px',padding:'5px 9px',borderRadius:'9px',fontWeight:'600',cursor:'pointer'}}>
                                  {tObj.emoji} {tObj.name}
                                </span>
                              );
                            })}
                            {(!activeOuting().tier[tierPlayerId || me]?.pool || activeOuting().tier[tierPlayerId || me].pool.length === 0) && (
                              <span style={{color:'#bcaea4',fontSize:'12px'}}>Tout est classé !</span>
                            )}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* BOTTOM NAVIGATION TAB-BAR */}
              <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:'440px',background:'rgba(250,246,241,.95)',backdropFilter:'blur(10px)',borderTop:'1px solid #ece0d6',display:'flex',padding:'8px 6px 10px',zIndex:40}}>
                {isMeHost ? (
                  // Host bottoms
                  [
                    { id: 'parcours', label: 'Parcours', svg: <path d="M8.2 17.6h6a3.1 3.1 0 0 0 0-6.2h-4.4a3.1 3.1 0 0 1 0-6.2H16"/>, wrap: <><circle cx="6" cy="18.5" r="2.2"/><circle cx="18" cy="5.5" r="2.2"/></> },
                    { id: 'history', label: 'Historique', svg: <path d="M12 7.5v5l3 2"/>, wrap: <circle cx="12" cy="12" r="8.5"/> },
                    { id: 'results', label: 'Résultats', svg: <path d="M5 20V10M12 20V4M19 20v-7"/> }
                  ].map(tabItem => (
                    <button key={tabItem.id} onClick={() => { setTab(tabItem.id); setEditOutingId(null); }} style={{flex:1,background:'none',border:'none',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',cursor:'pointer',color: tab===tabItem.id?'#c26a4a':'#bcaea4'}}>
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                        {tabItem.wrap}
                        {tabItem.svg}
                      </svg>
                      <span style={{fontSize:'10.5px',fontWeight:'700'}}>{tabItem.label}</span>
                    </button>
                  ))
                ) : (
                  // Guest bottoms
                  [
                    { id: 'parcours', label: 'Parcours', svg: <path d="M8.2 17.6h6a3.1 3.1 0 0 0 0-6.2h-4.4a3.1 3.1 0 0 1 0-6.2H16"/>, wrap: <><circle cx="6" cy="18.5" r="2.2"/><circle cx="18" cy="5.5" r="2.2"/></> },
                    { id: 'live', label: 'À jouer', svg: <path d="M4 7v11a2 2 0 0 0 2 2h9"/>, wrap: <rect x="7" y="4" width="12" height="16" rx="2"/> },
                    { id: 'results', label: 'Résultats', svg: <path d="M5 20V10M12 20V4M19 20v-7"/> }
                  ].map(tabItem => (
                    <button key={tabItem.id} onClick={() => setTab(tabItem.id)} style={{flex:1,background:'none',border:'none',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',cursor:'pointer',color: tab===tabItem.id?'#c26a4a':'#bcaea4'}}>
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                        {tabItem.wrap}
                        {tabItem.svg}
                      </svg>
                      <span style={{fontSize:'10.5px',fontWeight:'700'}}>{tabItem.label}</span>
                    </button>
                  ))
                )}
              </div>

            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
