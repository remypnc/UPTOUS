  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; font-family: 'Quicksand', system-ui, sans-serif; color: #3f3733; background: #e7ded7; }
    a { color: #c26a4a; text-decoration: none; }
    a:hover { color: #a5502f; }
    input, select, textarea, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #d0c2b7; border-radius: 4px; }
    svg { display: block; }
    
    .app-frame {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      background: #f7f1eb;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 0 0 60px rgba(90,70,55,.12);
      display: flex;
      flex-direction: column;
    }

    /* Custom Styled Real Checkboxes */
    .custom-checkbox-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .custom-checkbox-input {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #c26a4a;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      background: #fff;
      display: grid;
      place-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .custom-checkbox-input:checked {
      background: #c26a4a;
      border-color: #c26a4a;
    }
    .custom-checkbox-input:checked::before {
      content: "✓";
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
    }
    .custom-checkbox-input:focus-visible {
      box-shadow: 0 0 0 3px rgba(194, 106, 74, 0.3);
    }
    
    @keyframes shf { 0%{transform:translate(0,0) rotate(0)} 25%{transform:translate(28px,-10px) rotate(8deg)} 50%{transform:translate(-20px,8px) rotate(-6deg)} 75%{transform:translate(15px,-5px) rotate(4deg)} 100%{transform:translate(0,0) rotate(0)} }
    @keyframes pop { 0%{transform:scale(.92);opacity:0} 60%{transform:scale(1.03)} 100%{transform:scale(1);opacity:1} }
    @keyframes conf { 0%{transform:translateY(-10vh) rotate(0);opacity:1} 100%{transform:translateY(105vh) rotate(540deg);opacity:1} }
    @keyframes riseIn { 0%{transform:translateY(16px);opacity:0} 100%{transform:translateY(0);opacity:1} }
    @keyframes pulseGlow { 0%{transform:scale(0.96);opacity:0.8} 100%{transform:scale(1.04);opacity:1} }

    .animate-rise { animation: riseIn .35s ease both; }
    .animate-pop { animation: pop .3s ease both; }

    .btn-primary {
      background: #a64d2e;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 15.5px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(166, 77, 46, .28);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: #8e3e23;
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #5f8a6d;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 15.5px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(95, 138, 109, .28);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      background: #476c53;
      transform: translateY(-1px);
    }
    .btn-secondary:active {
      transform: translateY(0);
    }

    .blur-step {
      filter: blur(6px);
      user-select: none;
      pointer-events: none;
      opacity: 0.6;
    }
  </style>
</head>

    // Cloud & Local Room Sync Engine (Always succeeds!)
    async function saveRoomToStorage(room) {
      if (!room || !room.code) return false;
      const codeKey = room.code.toUpperCase();
      
      // Save local first (Guaranteed to work 100%)
      try {
        localStorage.setItem(`uptous_room_${codeKey}`, JSON.stringify(room));
        if (localChannel) {
          localChannel.postMessage({ type: 'ROOM_UPDATE', code: codeKey, room });
        }
      } catch(e) {}

      // Save to Firestore if connected
      if (db) {
        try {
          await db.collection('rooms').doc(codeKey).set(room, { merge: true });
        } catch(e) {
          console.warn("Firestore setDoc fallback used:", e);
        }
      }
      return true;
    }

    async function fetchRoomFromStorage(code) {
      if (!code) return null;
      const codeKey = code.toUpperCase();

      // Try Firestore first
      if (db) {
        try {
          const snap = await db.collection('rooms').doc(codeKey).get();
          if (snap.exists) {
            const data = snap.data();
            localStorage.setItem(`uptous_room_${codeKey}`, JSON.stringify(data));
            return data;
          }
        } catch(e) {
          console.warn("Firestore getDoc error, checking localStorage", e);
        }
      }

      // Fallback to localStorage
      try {
        const raw = localStorage.getItem(`uptous_room_${codeKey}`);
        if (raw) return JSON.parse(raw);
      } catch(e) {}

      return null;
    }

    // Google Maps / OpenStreetMap Address Search Component
    function GoogleMapsSearchInput({ value, onChange, onSelectPlace, placeholder }) {
      const inputRef = useRef(null);
      const [suggestions, setSuggestions] = useState([]);
      const [showDropdown, setShowDropdown] = useState(false);

      useEffect(() => {
        if (window.google && window.google.maps && window.google.maps.places && inputRef.current) {
          try {
            const autocomplete = new window.google.maps.places.Autocomplete(inputRef.current, {
              types: ['establishment', 'geocode'],
              componentRestrictions: { country: 'fr' }
            });
            autocomplete.addListener('place_changed', () => {
              const place = autocomplete.getPlace();
              if (place) {
                const name = capitalize(place.name || '');
                const address = place.formatted_address || place.vicinity || '';
                onSelectPlace({ name, address });
              }
            });
          } catch(e) {}
        }
      }, []);

      const handleTextChange = (e) => {
        const val = capitalize(e.target.value);
        onChange(val);
        
        if (val.length > 2) {
          fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val + ' Paris')}&limit=4`)
            .then(res => res.json())
            .then(data => {
              if (data && Array.isArray(data)) {
                setSuggestions(data.map(item => ({
                  name: capitalize(item.display_name.split(',')[0]),
                  address: item.display_name
                })));
                setShowDropdown(true);
              }
            })
            .catch(() => {});
        } else {
          setShowDropdown(false);
        }
      };

      return (
        <div style={{position:'relative',width:'100%'}}>
          <input
            ref={inputRef}
            type="text"
            value={value}
            onChange={handleTextChange}
            placeholder={placeholder || "Nom ou adresse du lieu (ex: Otacos Rivoli, Paris)"}
            style={{width:'100%',padding:'11px 13px',border:'1px solid #eeddd3',borderRadius:'10px',fontSize:'13.5px',outline:'none',background:'#fff',color:'#3f3733'}}
          />
          {showDropdown && suggestions.length > 0 && (
            <div style={{position:'absolute',top:'100%',left:0,right:0,background:'#fff',border:'1px solid #eeddd3',borderRadius:'10px',boxShadow:'0 8px 20px rgba(0,0,0,0.12)',zIndex:120,marginTop:'4px',overflow:'hidden'}}>
              {suggestions.map((s, idx) => (
                <div
                  key={idx}
                  onClick={() => {
                    onSelectPlace(s);
                    setShowDropdown(false);
                  }}
                  style={{padding:'9px 12px',borderBottom:'1px solid #f4ede6',cursor:'pointer',fontSize:'12.5px'}}
                >
                  <div style={{fontWeight:'700',color:'#3f3733'}}>📍 {s.name}</div>
                  <div style={{fontSize:'11px',color:'#8b7d74',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.address}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

      // Check URL parameters & previous session on mount

        const session = localStorage.getItem('uptous_session_v3');

              setLoading(false);
            });
          } catch(e) {
            setLoading(false);
          }
        }
      }, []);

      // Realtime subscription (Firestore + BroadcastChannel)
      useEffect(() => {
        if (screen === 'app' && room && room.code) {
          const codeKey = room.code.toUpperCase();
          
          // Firestore listener
          let unsub = null;
          if (db) {
            try {
              unsub = db.collection('rooms').doc(codeKey).onSnapshot(doc => {
                if (isWritingRef.current) return;
                if (doc.exists) {
                  const updated = doc.data();
                  if (JSON.stringify(updated) !== JSON.stringify(room)) {
                    setRoom(updated);
                    if (updated.live) {
                      if (!play || play.qid !== updated.live.qid || play.refId !== updated.live.refId) {
                        initPlayFromLive(updated.live, updated);
                      }
                    } else {
                      setPlay(null);
                    }
                  }
                }
              });
            } catch(e) {}
          }

          // BroadcastChannel listener for local tabs
          const handleBroadcast = (e) => {
            if (e.data && e.data.type === 'ROOM_UPDATE' && e.data.code === codeKey) {
              if (isWritingRef.current) return;
              const updated = e.data.room;
              setRoom(updated);
              if (updated.live) {
                initPlayFromLive(updated.live, updated);
              } else {
                setPlay(null);
              }
            }
          };

          if (localChannel) {
            localChannel.addEventListener('message', handleBroadcast);
          }

          return () => {
            if (unsub) unsub();
            if (localChannel) localChannel.removeEventListener('message', handleBroadcast);
          };
        }
      }, [screen, room?.code, play]);

      const writeRoom = async (updatedRoom) => {
        isWritingRef.current = true;
        setRoom(updatedRoom);
        await saveRoomToStorage(updatedRoom);
        setTimeout(() => { isWritingRef.current = false; }, 300);
      };

      const randCode = () => {
        const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let s = '';
        for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)];
        return s;
      };

      // Create Room Step 1
      const handleCreateRoom = async () => {
        setLoading(true);
        const code = randCode();
        setObCode(code);
        setObPassword('1234');
        setObTitle(obTitle || 'Balade Gourmande');
        setObStep('create');
        setLoading(false);
      };

      const proceedToModeSelection = () => {
        setObStep('mode');
      };

      const finishCreateRoom = async () => {
        setLoading(true);
        setObError('');
        const creatorId = 'p_' + uid();
        const hostName = capitalize(obPseudo) || 'Hôte Alex';
        const players = [{ id: creatorId, name: hostName, isHost: true }];

        if (obMode === 'solo' && obGuestName.trim()) {
          const guestId = 'p_' + uid();
          players.push({ id: guestId, name: capitalize(obGuestName), isHost: false });
        }
        
        const firstOuting = blankOuting(obTitle, creatorId);
        firstOuting.status = 'current';

        const newRoom = {
          code: obCode.toUpperCase(),
          password: obPassword.trim() || '1234',
          mode: obMode,
          createdAt: Date.now(),
          players,
          outings: [firstOuting],
          activeOutingId: firstOuting.id,
          live: null
        };

        // Always succeeds via localStorage / BroadcastChannel / Firestore
        await saveRoomToStorage(newRoom);

        setRoom(newRoom);
        setMe(creatorId);
        localStorage.setItem('uptous_session_v3', JSON.stringify({ code: newRoom.code, me: creatorId }));
        setScreen('app');
        setTab('parcours');
        setLoading(false);
        flash(`Room ${newRoom.code} créée avec succès !`);
      };

      // Join Room
      const handleJoinRoom = async () => {
        if (!obCode || obCode.length < 4) {
          setObError("Code de room à 4 caractères requis");
          return;
        }
        setLoading(true);
        const fetchedRoom = await fetchRoomFromStorage(obCode);
        if (!fetchedRoom) {
          setObError("Room introuvable avec ce code");
          setLoading(false);
          return;
        }
        if (fetchedRoom.password !== obPassword.trim()) {
          setObError("Mot de passe incorrect");
          setLoading(false);
          return;
        }

        const guestId = 'p_' + uid();
        let guestName = capitalize(obPseudo);
        if (!guestName) {
          let count = 1;
          while (fetchedRoom.players.some(p => p.name === `Participant ${count}`)) count++;
          guestName = `Participant ${count}`;
        }

        const updatedPlayers = [...fetchedRoom.players, { id: guestId, name: guestName, isHost: false }];
        const updatedRoom = { ...fetchedRoom, players: updatedPlayers };

        await saveRoomToStorage(updatedRoom);

        setRoom(updatedRoom);
        setMe(guestId);
        localStorage.setItem('uptous_session_v3', JSON.stringify({ code: updatedRoom.code, me: guestId }));
        setScreen('app');
        setTab('parcours');
        setLoading(false);
        flash(`Bienvenue dans la room ${updatedRoom.code} !`);
      };

      const handleLogOut = () => {
        localStorage.removeItem('uptous_session_v3');
        setRoom(null);
        setMe(null);
        setScreen('onboarding');
        setObStep('welcome');
        setRoomInfoOpen(false);
        flash("Déconnecté");
      };

      const renameMyPseudo = (newName) => {
        if (!newName.trim()) return;
        const updated = {
          ...room,
          players: room.players.map(p => p.id === me ? { ...p, name: capitalize(newName) } : p)
        };
        writeRoom(updated);
        setEditingPseudo(false);
        flash("Pseudo mis à jour !");
      };

      const activeOuting = () => {
        if (!room || !room.outings || !room.outings.length) return null;
        return room.outings.find(o => o.id === room.activeOutingId) || room.outings[0];
      };

      const ao = activeOuting();
      const isMeHost = ao ? (ao.creatorId === me || room?.players[0]?.id === me) : false;

      const updateActiveOuting = (fn) => {
        const currentAo = activeOuting();
        if (!currentAo) return;
        const updatedOuting = fn(currentAo);
        const updatedRoom = {
          ...room,
          outings: room.outings.map(o => o.id === currentAo.id ? updatedOuting : o)
        };
        writeRoom(updatedRoom);
      };

      // Trigger Live Quiz Modal on Participant Phones
      const initPlayFromLive = (live, customRoom) => {
        const r = customRoom || room;
        const currentAo = r.outings.find(o => o.id === r.activeOutingId);
        if (!currentAo) return;

        if (live.kind === 'question') {
          const q = currentAo.questions.find(x => x.id === live.qid);
          if (q) {
            setSelectedOptions([]);
            setPlay({
              kind: 'question',
              qid: q.id,
              isMultiSelect: !!q.isMultiSelect,
              options: q.options || [q.a, q.b],
              title: q.text,
              phase: 'ready',
              player: me
            });
          }
        } else if (live.kind === 'forced') {
          const f = currentAo.forced.find(x => x.id === live.refId);
          if (f) {
            const itemA = f.aObj;
            const itemB = f.bObj;
            if (!itemA || !itemB) return;
            setSelectedOptions([]);
            setPlay({
              kind: 'quiz',
              options: [itemA, itemB],
              champ: itemA,
              deck: [],
              round: 1,
              title: 'Duel imposé',
              refId: f.id,
              phase: 'ready',
              player: me
            });
          }
        } else if (live.kind === 'quiz') {
          let rest = (currentAo.catalog[live.category] || []).filter(x => x.enabled).map(x => ({ id: x.id, name: x.name, emoji: x.emoji, address: x.address || '' }));
          if (rest.length < 2) return;
          const champ = rest.shift();
          const chall = rest.shift();
          setSelectedOptions([]);
          setPlay({
            kind: 'quiz',
            category: live.category,
            deck: rest,
            champ,
            options: [champ, chall],
            round: 1,
            title: `Duel de goûts : ${CATS.find(c=>c.id===live.category)?.name || 'Choix'}`,
            phase: 'ready',
            player: me
          });
        }
      };

      const launchStep = (step) => {
        const currentAo = activeOuting();
        let liveObj = null;
        if (step.kind === 'forced') {
          const f = currentAo.forced.find(x => x.id === step.ref);
          if (f) liveObj = { kind: 'forced', refId: f.id, title: step.title };
        } else if (step.kind === 'question') {
          const q = currentAo.questions.find(x => x.id === step.ref);
          if (q) liveObj = { kind: 'question', qid: q.id, title: q.text };
        } else if (step.kind === 'quiz') {
          liveObj = { kind: 'quiz', category: step.ref, title: step.title };
        }

        if (liveObj) {
          const updated = { ...room, live: liveObj };
          writeRoom(updated);
          flash("🚀 Quiz lancé ! Les téléphones des invités s'ouvrent.");
        }
      };

      const toggleCheckboxOption = (optId) => {
        if (play && play.isMultiSelect) {
          if (selectedOptions.includes(optId)) {
            setSelectedOptions(selectedOptions.filter(id => id !== optId));
          } else {
            setSelectedOptions([...selectedOptions, optId]);
          }
        } else {
          setSelectedOptions([optId]);
        }
      };

      const submitQuizAnswer = () => {
        const currentAo = activeOuting();
        if (!play || !currentAo || selectedOptions.length === 0) return;

        let updatedRoom = { ...room };
        const outingIdx = room.outings.findIndex(o => o.id === currentAo.id);
        const outingObj = { ...room.outings[outingIdx] };

        if (play.kind === 'question') {
          const currentAnswers = outingObj.answers[play.qid] || {};
          currentAnswers[me] = selectedOptions;
          outingObj.answers[play.qid] = currentAnswers;
        } else if (play.kind === 'quiz') {
          const currentFavs = outingObj.favorites[me] || {};
          currentFavs[play.category || play.refId] = selectedOptions[0];
          outingObj.favorites[me] = currentFavs;
        }

        updatedRoom.outings[outingIdx] = outingObj;
        setPlay(null);
        setSelectedOptions([]);
        writeRoom(updatedRoom);
        triggerConfetti();
        flash("Choix enregistré avec succès !");
      };

      // Add Step to Parcours
      const handleCreateStep = () => {
        const currentAo = activeOuting();
        if (!currentAo) return;

        if (newStepKind === 'place') {
          if (!newStepTitle.trim()) {
            flash("Veuillez entrer le nom du lieu");
            return;
          }
          const stepObj = {
            id: 's_' + uid(),
            title: capitalize(newStepTitle),
            detail: capitalize(newStepDetail) || 'Étape culinaire / Lieu',
            address: newStepAddress.trim(),
            kind: 'place',
            ref: null,
            done: false
          };
          updateActiveOuting(o => ({ ...o, timeline: [...o.timeline, stepObj] }));
          setNewStepTitle('');
          setNewStepDetail('');
          setNewStepAddress('');
          flash("Étape Lieu ajoutée !");

        } else if (newStepKind === 'question') {
          const fullQText = capitalize((newQPrefix + newQText).trim());
          if (!fullQText) {
            flash("Veuillez saisir le titre de la question");
            return;
          }
          const validOpts = newQOptions.filter(o => o.name.trim().length > 0).map(o => ({
            id: 'opt_' + uid(),
            name: capitalize(o.name),
            emoji: o.emoji || '🍽️',
            address: o.address.trim()
          }));

          if (validOpts.length < 2) {
            flash("Ajoutez au moins 2 propositions de choix");
            return;
          }

          const newQ = {
            id: 'q_' + uid(),
            text: fullQText,
            isMultiSelect: newQMulti,
            options: validOpts
          };

          const stepObj = {
            id: 's_' + uid(),
            title: fullQText,
            detail: `${validOpts.length} propositions ${newQMulti ? '(Choix multiples avec checkboxes)' : '(Choix unique)'}`,
            address: '',
            kind: 'question',
            ref: newQ.id,
            done: false
          };

          updateActiveOuting(o => ({
            ...o,
            questions: [...o.questions, newQ],
            timeline: [...o.timeline, stepObj]
          }));

          setNewQText('');
          setNewQOptions([
            { id: 'opt_1', name: '', emoji: '🍕', address: '' },
            { id: 'opt_2', name: '', emoji: '🍔', address: '' }
          ]);
          flash("Quiz de propositions ajouté au parcours !");

        } else if (newStepKind === 'forced') {
          const nameA = capitalize(newDuelA_name);
          const nameB = capitalize(newDuelB_name);
          if (!nameA || !nameB) {
            flash("Saisissez les 2 choix du duel");
            return;
          }
          const fObj = {
            id: 'f_' + uid(),
            cat: 'custom',
            aObj: { id: 'd_' + uid(), name: nameA, emoji: newDuelA_emoji, address: newDuelA_address.trim() },
            bObj: { id: 'd_' + uid(), name: nameB, emoji: newDuelB_emoji, address: newDuelB_address.trim() }
          };
          const stepObj = {
            id: 's_' + uid(),
            title: `Duel : ${nameA} vs ${nameB}`,
            detail: 'Duel culinaire imposé',
            address: '',
            kind: 'forced',
            ref: fObj.id,
            done: false
          };
          updateActiveOuting(o => ({
            ...o,
            forced: [...o.forced, fObj],
            timeline: [...o.timeline, stepObj]
          }));
          setNewDuelA_name('');
          setNewDuelA_address('');
          setNewDuelB_name('');
          setNewDuelB_address('');
          flash("Duel imposé ajouté au parcours !");

        } else if (newStepKind === 'quiz') {
          const catObj = CATS.find(c => c.id === newQuizCat) || CATS[0];
          const stepObj = {
            id: 's_' + uid(),
            title: `Duel de goûts : ${catObj.name}`,
            detail: 'Sélection et élimination par catégorie',
            address: '',
            kind: 'quiz',
            ref: catObj.id,
            done: false
          };
          updateActiveOuting(o => ({ ...o, timeline: [...o.timeline, stepObj] }));
          flash(`Duel ${catObj.name} ajouté !`);
        }
      };

      // Add Custom Option to Category Catalog
      const handleAddCategoryOption = () => {
        if (!newOptName.trim()) {
          flash("Entrez le nom de l'option");
          return;
        }
        const currentAo = activeOuting();
        if (!currentAo) return;

        const newItem = {
          id: slug(newOptName) + '-' + uid().slice(0, 3),
          name: capitalize(newOptName),
          emoji: newOptEmoji || '🍩',
          address: newOptAddress.trim(),
          cat: prepCat,
          enabled: true, // Activated by default with checkbox checked
          mandatory: false
        };

        updateActiveOuting(o => ({
          ...o,
          catalog: {
            ...o.catalog,
            [prepCat]: [...(o.catalog[prepCat] || []), newItem]
          }
        }));

        setNewOptName('');
        setNewOptAddress('');
        flash("Nouveau choix ajouté et coché !");
      };

      const toggleSelectAllCategory = (catId, shouldEnable) => {
        const currentAo = activeOuting();
        if (!currentAo) return;
        const updatedList = (currentAo.catalog[catId] || []).map(item => ({ ...item, enabled: shouldEnable }));
        updateActiveOuting(o => ({
          ...o,
          catalog: {
            ...o.catalog,
            [catId]: updatedList
          }
        }));
        flash(shouldEnable ? "Tous les choix cochés" : "Tous les choix décochés");
      };

      const copyShareLink = () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}?code=${room.code}&pass=${room.password}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl);
          flash("Lien d'invitation copié !");
        } else {
          flash(`Code: ${room.code} (Mot de passe: ${room.password})`);
        }
      };

      const openEmojiPicker = (onSelectFn) => {
        setEmojiTargetCallback(() => onSelectFn);
        setEmojiModalOpen(true);
      };

      return (
        <div className="app-frame">
          {/* LOADING OVERLAY */}
          {loading && (
            <div style={{position:'fixed',inset:0,background:'rgba(247,241,235,0.88)',backdropFilter:'blur(8px)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:400}} className="animate-pop">
              <div style={{position:'relative',width:'70px',height:'70px',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <div style={{position:'absolute',inset:0,border:'4px solid #ece0d6',borderTop:'4px solid #c26a4a',borderRadius:'50%',animation:'shf 0.9s linear infinite'}}></div>
                <div style={{fontSize:'30px',animation:'pulseGlow 0.8s infinite alternate'}}>🗺️</div>
              </div>
              <div style={{marginTop:'16px',fontWeight:'700',color:'#3f3733',fontSize:'16px',fontFamily:'"Instrument Serif", serif'}}>Connexion à la room...</div>
            </div>
          )}

          {/* TOAST NOTIFICATION */}
          {toast && (
            <div style={{position:'fixed',bottom:'84px',left:'50%',transform:'translateX(-50%)',background:'#3f3733',color:'#fff',fontSize:'13.5px',fontWeight:'600',padding:'10px 18px',borderRadius:'13px',zIndex:450,boxShadow:'0 10px 30px rgba(0,0,0,0.18)',animation:'pop 0.3s ease both',maxWidth:'90%',textAlign:'center'}}>
              {toast}
            </div>
          )}

          {/* CONFETTI ANIMATION */}
          {confetti && (
            <div style={{position:'fixed',inset:0,pointerEvents:'none',zIndex:410}}>
              {Array.from({length:24}).map((_,i) => {
                const cols = ['#c26a4a','#d9b45f','#6f9a7d','#d98f5c','#8f83b0'];
                return (
                  <div key={i} style={{
                    position:'absolute',
                    top:0,
                    left: `${Math.round(Math.random()*96)}%`,
                    width: `${7 + Math.random()*7}px`,
                    height: `${7 + Math.random()*7}px`,
                    background: cols[i % cols.length],
                    borderRadius: '2px',
                    animation: `conf ${1.5 + Math.random()*1.1}s linear ${Math.random()*0.4}s forwards`
                  }} />
                );
              })}
            </div>
          )}

          {/* EMOJI PICKER MODAL */}
          <EmojiPickerModal
            isOpen={emojiModalOpen}
            onClose={() => setEmojiModalOpen(false)}
            onSelect={(e) => {
              if (emojiTargetCallback) emojiTargetCallback(e);
            }}
          />

          {/* 1. ONBOARDING SCREEN */}
          {screen === 'onboarding' && (
            <div style={{minHeight:'100vh',padding:'26px 22px 40px',display:'flex',flexDirection:'column',justifyContent:'center'}} className="animate-rise">
              
              {obStep === 'welcome' && (
                <div style={{textAlign:'center'}}>
                  <div style={{width:'74px',height:'74px',margin:'0 auto 18px',borderRadius:'24px',background:'#3f3733',display:'flex',alignItems:'center',justifyContent:'center',color:'#f7f1eb',boxShadow:'0 12px 28px rgba(60,50,45,.2)'}}>
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="18.5" r="2.3"/><circle cx="18" cy="5.5" r="2.3"/><path d="M8.2 17.6h6a3.1 3.1 0 0 0 0-6.2h-4.4a3.1 3.1 0 0 1 0-6.2H16"/></svg>
                  </div>
                  <div style={{fontFamily:'"Instrument Serif", serif',fontSize:'58px',lineHeight:'1',color:'#3f3733'}}>Uptous</div>
                  <p style={{color:'#8b7d74',margin:'14px auto 30px',maxWidth:'290px',fontSize:'15px',lineHeight:'1.5'}}>Créez vos parcours gourmands, lancez des quiz en direct et partagez le code de room sur mobile.</p>
                  <button onClick={() => setObStep('name')} className="btn-primary" style={{width:'100%',maxWidth:'240px'}}>Commencer</button>
                </div>
              )}

              {obStep === 'name' && (
                <div>
                  <button onClick={() => setObStep('welcome')} style={{background:'none',border:'none',color:'#a89a90',fontSize:'15px',padding:0,cursor:'pointer',marginBottom:'24px'}}>← retour</button>
                  <div style={{fontFamily:'"Instrument Serif", serif',fontSize:'36px',marginBottom:'6px'}}>Votre Pseudo</div>
                  <p style={{color:'#8b7d74',fontSize:'14px',margin:'0 0 22px'}}>Comment souhaitez-vous vous appeler dans la room ?</p>
                  <input value={obPseudo} onChange={e => setObPseudo(capitalize(e.target.value))} placeholder="ex: Alex, Hugo, Camille..." style={{width:'100%',padding:'16px 18px',border:'2px solid #ece0d6',borderRadius:'14px',fontSize:'16px',background:'#fff',outline:'none',color:'#3f3733',marginBottom:'24px'}}/>
                  <button onClick={() => setObStep('action')} className="btn-primary" style={{width:'100%'}}>Continuer →</button>
                </div>
              )}

              {obStep === 'action' && (
                <div>
                  <button onClick={() => setObStep('name')} style={{background:'none',border:'none',color:'#a89a90',fontSize:'15px',padding:0,cursor:'pointer',marginBottom:'24px'}}>← retour</button>
                  <div style={{fontFamily:'"Instrument Serif", serif',fontSize:'34px',marginBottom:'22px'}}>Que souhaitez-vous faire ?</div>
                  
                  <div onClick={() => { handleCreateRoom(); }} style={{background:'#fff',border:'2px solid #ecd9cd',borderRadius:'16px',padding:'18px',marginBottom:'14px',cursor:'pointer',display:'flex',gap:14,alignItems:'center',boxShadow:'0 6px 18px rgba(160,110,80,.07)'}}>
                    <div style={{width:'44px',height:'44px',borderRadius:'13px',background:'#f6e5db',color:'#c26a4a',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg></div>
                    <div><div style={{fontWeight:'700',fontSize:'17px'}}>Créer une Room</div><div style={{color:'#8b7d74',fontSize:'13px',marginTop:'2px'}}>Générez un code et préparez un parcours.</div></div>
                  </div>
                  
                  <div onClick={() => { setObStep('join'); }} style={{background:'#fff',border:'2px solid #d8e2d6',borderRadius:'16px',padding:'18px',cursor:'pointer',display:'flex',gap:14,alignItems:'center',boxShadow:'0 6px 18px rgba(110,140,110,.07)'}}>
                    <div style={{width:'44px',height:'44px',borderRadius:'13px',background:'#e4ede2',color:'#5f8a6d',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 12h13M11 6l6 6-6 6"/></svg></div>
                    <div><div style={{fontWeight:'700',fontSize:'17px'}}>Rejoindre une Room</div><div style={{color:'#8b7d74',fontSize:'13px',marginTop:'2px'}}>Entrez un code à 4 caractères.</div></div>
                  </div>
                </div>
              )}

              {obStep === 'create' && (
                <div>
                  <button onClick={() => setObStep('action')} style={{background:'none',border:'none',color:'#a89a90',fontSize:'15px',padding:0,cursor:'pointer',marginBottom:'20px'}}>← retour</button>
                  <div style={{fontFamily:'"Instrument Serif", serif',fontSize:'32px',marginBottom:'4px'}}>Créer la Room</div>
                  <p style={{color:'#8b7d74',fontSize:'13.5px',margin:'0 0 20px'}}>Définissez le nom du parcours et le mot de passe.</p>
                  
                  <label style={{fontSize:'13px',fontWeight:'700',color:'#a2938a'}}>Nom de la balade / du parcours</label>
                  <input value={obTitle} onChange={e => setObTitle(capitalize(e.target.value))} placeholder="ex : Balade Gourmande Paris" style={{width:'100%',padding:'14px 16px',border:'2px solid #ece0d6',borderRadius:'12px',fontSize:'15px',background:'#fff',outline:'none',margin:'6px 0 14px'}}/>
                  
                  <div style={{display:'flex',gap:'12px',marginBottom:'14px'}}>
                    <div style={{flex:1}}>
                      <label style={{fontSize:'13px',fontWeight:'700',color:'#a2938a'}}>Code Room</label>
                      <input value={obCode} onChange={e => setObCode(e.target.value.toUpperCase().slice(0,4))} maxLength={4} style={{width:'100%',padding:'14px 16px',border:'2px solid #ece0d6',borderRadius:'12px',fontSize:'18px',letterSpacing:'4px',textAlign:'center',background:'#fcfbf9',color:'#3f3733',fontWeight:'700',marginTop:'6px'}}/>

                                  )}
                                </div>
                                <div style={{display:'flex',gap:'6px',marginBottom:'6px'}}>
                                  <button type="button" onClick={() => openEmojiPicker(e => {
                                    setNewQOptions(newQOptions.map(o => o.id === opt.id ? { ...o, emoji: e } : o));
                                  })} style={{fontSize:'18px',width:'44px',height:'38px',border:'1px solid #eeddd3',borderRadius:'8px',background:'#fff',cursor:'pointer'}}>{opt.emoji}</button>
                                  <input 
                                    value={opt.name} 
                                    onChange={e => setNewQOptions(newQOptions.map(o => o.id === opt.id ? { ...o, name: capitalize(e.target.value) } : o))} 
                                    placeholder={`ex: Option ${idx+1}`} 
                                    style={{flex:1,padding:'8px 10px',border:'1px solid #eeddd3',borderRadius:'8px',fontSize:'13px'}}
                                  />
                                </div>
                                <input 
                                  value={opt.address} 
                                  onChange={e => setNewQOptions(newQOptions.map(o => o.id === opt.id ? { ...o, address: e.target.value } : o))} 
                                  placeholder="Adresse de cette nourriture (facultatif)" 
                                  style={{width:'100%',padding:'7px 10px',border:'1px solid #eeddd3',borderRadius:'8px',fontSize:'12px'}}
                                />
                              </div>
                            ))}

                            <button type="button" onClick={() => setNewQOptions([...newQOptions, { id: 'opt_' + uid(), name: '', emoji: '🍿', address: '' }])} style={{background:'#f4ede6',border:'none',color:'#7a6c64',padding:'9px',borderRadius:'10px',fontSize:'12.5px',fontWeight:'700',cursor:'pointer'}}>
                              + Ajouter une option supplémentaire
                            </button>
                          </div>
                        )}

                        {/* DUEL IMPOSÉ CREATION */}
                        {newStepKind === 'forced' && (
                          <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
                            <div style={{background:'#fcfbf9',border:'1px solid #eee0d5',borderRadius:'11px',padding:'10px'}}>
                              <div style={{fontSize:'12px',fontWeight:'700',color:'#c26a4a',marginBottom:'6px'}}>1er Élément du Duel</div>
                              <div style={{display:'flex',gap:'6px',marginBottom:'6px'}}>
                                <button type="button" onClick={() => openEmojiPicker(setNewDuelA_emoji)} style={{fontSize:'18px',width:'44px',height:'38px',border:'1px solid #eeddd3',borderRadius:'8px',background:'#fff',cursor:'pointer'}}>{newDuelA_emoji}</button>
                                <input value={newDuelA_name} onChange={e => setNewDuelA_name(capitalize(e.target.value))} placeholder="ex: Otacos Rivoli" style={{flex:1,padding:'8px 10px',border:'1px solid #eeddd3',borderRadius:'8px',fontSize:'13px'}}/>
                              </div>
                              <input value={newDuelA_address} onChange={e => setNewDuelA_address(e.target.value)} placeholder="Adresse nourriture 1" style={{width:'100%',padding:'7px 10px',border:'1px solid #eeddd3',borderRadius:'8px',fontSize:'12px'}}/>
                            </div>

                            <div style={{background:'#fcfbf9',border:'1px solid #eee0d5',borderRadius:'11px',padding:'10px'}}>
                              <div style={{fontSize:'12px',fontWeight:'700',color:'#5f8a6d',marginBottom:'6px'}}>2e Élément du Duel</div>
                              <div style={{display:'flex',gap:'6px',marginBottom:'6px'}}>
                                <button type="button" onClick={() => openEmojiPicker(setNewDuelB_emoji)} style={{fontSize:'18px',width:'44px',height:'38px',border:'1px solid #eeddd3',borderRadius:'8px',background:'#fff',cursor:'pointer'}}>{newDuelB_emoji}</button>
                                <input value={newDuelB_name} onChange={e => setNewDuelB_name(capitalize(e.target.value))} placeholder="ex: Burger Gourmet PNY" style={{flex:1,padding:'8px 10px',border:'1px solid #eeddd3',borderRadius:'8px',fontSize:'13px'}}/>
                              </div>
                              <input value={newDuelB_address} onChange={e => setNewDuelB_address(e.target.value)} placeholder="Adresse nourriture 2" style={{width:'100%',padding:'7px 10px',border:'1px solid #eeddd3',borderRadius:'8px',fontSize:'12px'}}/>
                            </div>
                          </div>
                        )}

                        {/* QUIZ CAT SELECTOR */}
                        {newStepKind === 'quiz' && (
                          <div>
                            <label style={{fontSize:'12px',fontWeight:'700',color:'#a2938a',display:'block',marginBottom:'6px'}}>Catégorie de nourriture :</label>
                            <select value={newQuizCat} onChange={e => setNewQuizCat(e.target.value)} style={{width:'100%',padding:'10px',borderRadius:'10px',border:'1px solid #eeddd3',background:'#fff',fontSize:'13.5px'}}>
                              {CATS.map(c => (
                                <option key={c.id} value={c.id}>{c.name}</option>
                              ))}
                            </select>
                          </div>
                        )}

                        <button onClick={handleCreateStep} className="btn-primary" style={{width:'100%',marginTop:'14px',padding:'13px'}}>
                          Ajouter au parcours
                        </button>
                      </div>
                    )}

                    {/* TIMELINE SECTION TITLE */}
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
                      <div style={{fontFamily:'"Instrument Serif", serif',fontSize:'26px'}}>Programme de la Balade</div>
                      {activeOuting()?.status === 'done' && (
                        <span style={{fontSize:'12px',fontWeight:'700',color:'#4c7d5b',background:'#e4ede2',padding:'4px 10px',borderRadius:'8px'}}>Balade terminée</span>
                      )}
                    </div>

                    {/* EMPTY TIMELINE */}
                    {(!activeOuting()?.timeline || activeOuting().timeline.length === 0) && (
                      <div style={{background:'#fff',border:'2px dashed #e0cdc0',borderRadius:'18px',padding:'32px 20px',textAlign:'center',margin:'10px 0 20px'}}>
                        <div style={{fontSize:'42px',marginBottom:'8px'}}>🗺️</div>
                        <div style={{fontFamily:'"Instrument Serif", serif',fontSize:'24px',color:'#3f3733',marginBottom:'6px'}}>Aucune étape au parcours</div>
                        <p style={{color:'#8b7d74',fontSize:'13.5px',lineHeight:'1.4',margin:'0'}}>
                          Utilisez le formulaire ci-dessus pour ajouter des étapes et des quiz.
                        </p>
                      </div>
                    )}

                    {/* TIMELINE LIST */}
                    <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
                      {activeOuting()?.timeline.map((s, idx) => {
                        const isAnswered = s.kind === 'question' ? !!(activeOuting().answers[s.ref]) : (s.kind === 'forced' ? (activeOuting().favorites && Object.keys(activeOuting().favorites).length > 0) : false);
                        const isDone = s.done;

                        let statusLabel = 'à faire';
                        let sf = '#a2938a';
                        let sb = '#f2ece7';
                        if (s.kind !== 'place' && !isAnswered) {
                          statusLabel = 'à lancer';
                          sf = '#c79a3f';
                          sb = '#fbefd9';
                        }
                        if (isAnswered && !isDone) {
                          statusLabel = 'répondu';
                          sf = '#5f86a8';
                          sb = '#e7f0f6';
                        }
                        if (isDone) {
                          statusLabel = 'terminé';
                          sf = '#4c7d5b';
                          sb = '#e4ede2';
                        }

                        const dotBg = isDone ? '#6f9a7d' : (s.kind !== 'place' && !isAnswered ? '#e6c46a' : '#ece0d6');
                        const dotFg = (isDone || (s.kind !== 'place' && !isAnswered)) ? '#fff' : '#a2938a';

                        return (
                          <div key={s.id} style={{display:'flex',gap:'12px',alignItems:'flex-start',position:'relative'}}>
                            <div style={{display:'flex',flexDirection:'column',alignItems:'center',alignSelf:'stretch'}}>
                              <div style={{width:'30px',height:'30px',borderRadius:'50%',background:dotBg,color:dotFg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'13px',fontWeight:'700',flexShrink:0}}>{idx+1}</div>
                              <div style={{flex:1,width:'2px',background:'#ece0d6',margin:'2px 0'}}></div>
                            </div>
                            
                            <div style={{flex:1,position:'relative'}}>
                              <div style={{background:'#fff',border:'1px solid #f0e6dd',borderRadius:'14px',padding:'13px 15px',marginBottom:'10px',boxShadow:'0 4px 12px rgba(160,120,90,.05)'}}>
                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:'8px'}}>
                                  <div style={{fontWeight:'700',fontSize:'15px'}}>{s.title}</div>
                                  <div style={{fontSize:'11px',fontWeight:'700',color:sf,background:sb,padding:'3px 9px',borderRadius:'9px',whiteSpace:'nowrap'}}>{statusLabel}</div>
                                </div>
                                <div style={{color:'#8b7d74',fontSize:'12.5px',marginTop:'3px'}}>{s.detail}</div>
                                <AddressBadge address={s.address} />

                                {isAnswered && !isMeHost && (
                                  <div style={{marginTop:'8px',fontSize:'12px',fontWeight:'700',color:'#5f8a6d',background:'#e4ede2',padding:'6px 10px',borderRadius:'8px'}}>
                                    ✓ Choix enregistré !
                                  </div>
                                )}

                                {/* HOST CONTROLS */}
                                {isMeHost && (
                                  <div style={{display:'flex',gap:'7px',flexWrap:'wrap',marginTop:'11px'}}>
                                    {s.kind !== 'place' && (
                                      <button onClick={() => launchStep(s)} style={{background:'#f7ddd3',border:'none',color:'#c26a4a',fontSize:'12.5px',padding:'7px 13px',borderRadius:'10px',cursor:'pointer',fontWeight:'700'}}>
                                        🚀 Lancer pour la room
                                      </button>
                                    )}
                                    <button onClick={() => updateActiveOuting(o => ({...o, timeline: o.timeline.map(x=>x.id===s.id?{...x,done:!x.done}:x)}))} style={{background: isDone?'#e4ede2':'#f4ede6',border:'none',color: isDone?'#4c7d5b':'#7a6c64',fontSize:'12.5px',padding:'7px 12px',borderRadius:'10px',cursor:'pointer',fontWeight:'600'}}>
                                      {isDone ? '✓ terminé' : 'Marquer terminé'}
                                    </button>
                                    <button onClick={() => updateActiveOuting(o => ({...o, timeline: o.timeline.filter(x=>x.id!==s.id)}))} style={{background:'#f7ddd3',border:'none',color:'#bb4b30',fontSize:'12.5px',padding:'7px 10px',borderRadius:'10px',cursor:'pointer'}}>
                                      🗑️
                                    </button>
                                  </div>
                                )}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>

                    {isMeHost && activeOuting()?.status !== 'done' && (
                      <button onClick={() => {
                        updateActiveOuting(o => ({ ...o, status: 'done' }));
                        setTierListModalOpen(true);
                        triggerConfetti();
                      }} className="btn-secondary" style={{width:'100%',marginTop:'20px',padding:'14px'}}>
                        🏁 Terminer la balade & Voir la Tier List
                      </button>
                    )}
                  </div>
                )}

                {/* 2. TAB CATÉGORIES & OPTIONS (WITH REAL CHECKBOXES) */}
                {tab === 'catalog' && (
                  <div className="animate-rise">
                    <div style={{fontFamily:'"Instrument Serif", serif',fontSize:'28px',marginBottom:'2px'}}>Catégories & Options</div>
                    <p style={{color:'#8b7d74',fontSize:'13px',margin:'0 0 14px'}}>Cochez les options souhaitées avec de vraies checkboxes et ajoutez vos adresses.</p>

                    {/* CATEGORY TABS */}
                    <div style={{display:'flex',gap:'7px',overflowX:'auto',paddingBottom:'8px',marginBottom:'14px'}}>
                      {CATS.map(c => (
                        <button key={c.id} onClick={() => setPrepCat(c.id)} style={{whiteSpace:'nowrap',background: prepCat===c.id?'#c26a4a':'#f4ede6',color: prepCat===c.id?'#fff':'#8b7d74',border:'none',padding:'8px 14px',borderRadius:'11px',fontSize:'13px',fontWeight:'600',cursor:'pointer'}}>
                          {c.name}
                        </button>
                      ))}
                    </div>

                    {/* QUICK ACTION BAR FOR CHECKBOXES */}
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
                      <div style={{fontSize:'12px',fontWeight:'700',color:'#8b7d74'}}>
                        {(activeOuting()?.catalog[prepCat] || []).filter(x => x.enabled).length} / {(activeOuting()?.catalog[prepCat] || []).length} sélectionnés
                      </div>
                      <div style={{display:'flex',gap:'8px'}}>
                        <button onClick={() => toggleSelectAllCategory(prepCat, true)} style={{background:'#e4ede2',color:'#5f8a6d',border:'none',borderRadius:'8px',padding:'5px 9px',fontSize:'11.5px',fontWeight:'700',cursor:'pointer'}}>Tout cocher</button>
                        <button onClick={() => toggleSelectAllCategory(prepCat, false)} style={{background:'#f4ede6',color:'#7a6c64',border:'none',borderRadius:'8px',padding:'5px 9px',fontSize:'11.5px',fontWeight:'700',cursor:'pointer'}}>Tout décocher</button>
                      </div>
                    </div>

                    {/* CHECKBOX ITEM LIST */}
                    <div style={{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'16px'}}>
                      {(activeOuting()?.catalog[prepCat] || []).map(it => (
                        <div key={it.id} style={{background:'#fff',border:'1px solid #f0e6dd',borderRadius:'12px',padding:'12px 14px',display:'flex',alignItems:'center',gap:'12px'}}>
                          {/* REAL INTERACTIVE CHECKBOX */}
                          <label className="custom-checkbox-container">
                            <input
                              type="checkbox"
                              className="custom-checkbox-input"
                              checked={!!it.enabled}
                              onChange={() => {
                                const currentAo = activeOuting();
                                const list = currentAo.catalog[prepCat].map(x => x.id === it.id ? { ...x, enabled: !x.enabled } : x);
                                updateActiveOuting(o => ({ ...o, catalog: { ...o.catalog, [prepCat]: list } }));
                              }}
                            />
                          </label>

                          <div style={{fontSize:'24px'}}>{it.emoji}</div>
                          <div style={{flex:1}}>
                            <div style={{fontSize:'14.5px',fontWeight:'700',color: it.enabled ? '#3f3733' : '#a89a90'}}>{it.name}</div>
                            <AddressBadge address={it.address} />
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* ADD CUSTOM OPTION FORM */}
                    <div style={{background:'#fbf5f0',border:'1px dashed #e0cdc0',borderRadius:'14px',padding:'14px',marginTop:'10px'}}>
                      <div style={{fontWeight:'700',fontSize:'14px',marginBottom:'10px',color:'#3f3733'}}>
                        + Ajouter un choix dans "{CATS.find(c=>c.id===prepCat)?.name}"
                      </div>
                      <div style={{display:'flex',gap:'8px',marginBottom:'8px'}}>
                        <button
                          type="button"
                          onClick={() => openEmojiPicker(setNewOptEmoji)}
                          style={{fontSize:'22px',width:'50px',height:'42px',border:'1px solid #eeddd3',borderRadius:'10px',background:'#fff',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}
                        >
                          {newOptEmoji}
                        </button>
                        <input
                          value={newOptName}
                          onChange={e => setNewOptName(capitalize(e.target.value))}
                          placeholder="Nom de l'option (ex: Churros)"
                          style={{flex:1,padding:'10px 12px',border:'1px solid #eeddd3',borderRadius:'10px',fontSize:'13.5px',background:'#fff',outline:'none'}}
                        />
                      </div>
                      <input
                        value={newOptAddress}
                        onChange={e => setNewOptAddress(e.target.value)}
                        placeholder="Adresse de cette nourriture (ex: 33 Rue Sainte-Anne, Paris)"
                        style={{width:'100%',padding:'9px 12px',border:'1px solid #eeddd3',borderRadius:'10px',fontSize:'12.5px',background:'#fff',outline:'none',marginBottom:'10px'}}
                      />
                      <button onClick={handleAddCategoryOption} className="btn-secondary" style={{width:'100%',padding:'11px',fontSize:'13.5px'}}>
                        + Ajouter cette option
                      </button>
                    </div>
                  </div>
                )}

                {/* 3. TAB HISTORIQUE */}
                {tab === 'history' && (
                  <div className="animate-rise">
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'2px'}}>
                      <div style={{fontFamily:'"Instrument Serif", serif',fontSize:'28px'}}>Vos Parcours</div>
                      <button onClick={() => {
                        const newO = blankOuting('Nouveau parcours', me);
                        writeRoom({ ...room, outings: [...room.outings, newO], activeOutingId: newO.id });
                        flash("Nouveau parcours créé !");
                      }} style={{background:'#c26a4a',color:'#fff',border:'none',borderRadius:'11px',padding:'9px 14px',fontSize:'13px',fontWeight:'700',cursor:'pointer'}}>+ Nouveau parcours</button>
                    </div>
                    <p style={{color:'#8b7d74',fontSize:'13px',margin:'2px 0 16px'}}>Toutes les balades créées dans cette room.</p>
                    
                    <div style={{display:'flex',flexDirection:'column',gap:'12px',marginBottom:'24px'}}>
                      {room.outings.map(o => (
                        <div key={o.id} style={{background:'#fff',border: o.id===room.activeOutingId?'2px solid #eecdbf':'2px solid #f0e6dd',borderRadius:'16px',padding:'15px',boxShadow:'0 4px 14px rgba(160,120,90,.05)'}}>
                          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                            <div>
                              <div style={{fontWeight:'700',fontSize:'16px'}}>{o.title}</div>
                              <div style={{fontSize:'12px',color:'#a2938a',marginTop:'2px'}}>{o.date}</div>
                            </div>
                            <div style={{fontSize:'11px',fontWeight:'700',color: o.id===room.activeOutingId?'#bb4b30':'#8b7d74',background: o.id===room.activeOutingId?'#f7ddd3':'#f2ece7',padding:'4px 9px',borderRadius:'9px'}}>
                              {o.id===room.activeOutingId ? 'en cours' : (o.status==='done'?'terminé':'brouillon')}
                            </div>
                          </div>
                          
                          <div style={{display:'flex',gap:'8px',marginTop:'12px',borderTop:'1px solid #f2ebe4',paddingTop:'11px'}}>
                            <button onClick={() => {
                              writeRoom({ ...room, activeOutingId: o.id });
                              setTab('parcours');
                              flash("Parcours sélectionné !");
                            }} style={{flex:1,background:'#f4ede6',border:'none',color:'#584c46',fontSize:'12.5px',fontWeight:'700',padding:'9px',borderRadius:'10px',cursor:'pointer'}}>Sélectionner ce parcours</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>

              {/* BOTTOM NAVIGATION BAR */}
              <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:'440px',background:'rgba(250,246,241,.96)',backdropFilter:'blur(10px)',borderTop:'1px solid #ece0d6',display:'flex',padding:'8px 6px 10px',zIndex:150}}>
                {[
                  { id: 'parcours', label: 'Parcours', svg: <path d="M8.2 17.6h6a3.1 3.1 0 0 0 0-6.2h-4.4a3.1 3.1 0 0 1 0-6.2H16"/>, wrap: <><circle cx="6" cy="18.5" r="2.2"/><circle cx="18" cy="5.5" r="2.2"/></> },
                  { id: 'catalog', label: 'Catégories', svg: <path d="M4 6h16M4 12h16M4 18h16"/> },
                  { id: 'history', label: 'Vos Parcours', svg: <path d="M12 7.5v5l3 2"/>, wrap: <circle cx="12" cy="12" r="8.5"/> }
                ].map(tabItem => (
                  <button key={tabItem.id} onClick={() => setTab(tabItem.id)} style={{flex:1,background:'none',border:'none',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',cursor:'pointer',color: tab===tabItem.id?'#c26a4a':'#bcaea4'}}>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                      {tabItem.wrap}
                      {tabItem.svg}
                    </svg>
                    <span style={{fontSize:'10.5px',fontWeight:'700'}}>{tabItem.label}</span>
                  </button>
                ))}
              </div>

            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
